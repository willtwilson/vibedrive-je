<!DOCTYPE html>
<html>
<head><title>Vibe Drive Jersey — Tests</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  .pass { color: #0f0; } .fail { color: #f00; } .pending { color: #fa0; }
  #results { white-space: pre; }
</style></head>
<body>
<h2>⚡ Vibe Drive Jersey 3D — Automated Tests</h2>
<div id="results">Running tests...</div>
<iframe id="game-frame" src="/index.html" style="display:none;"></iframe>
<iframe id="retro-frame" src="/index-retro.html" style="display:none;"></iframe>
<script>
const results = [];
let passCount = 0, failCount = 0;

function log(msg, status) {
  const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⏳';
  results.push(`${icon} ${msg}`);
  if (status === 'pass') passCount++;
  if (status === 'fail') failCount++;
  document.getElementById('results').textContent = results.join('\n');
}

function updateSummary() {
  results.push(`\n--- ${passCount} passed, ${failCount} failed ---`);
  document.getElementById('results').textContent = results.join('\n');
}

// Wait for iframe to load, then run tests
window.addEventListener('load', () => {
  const frame = document.getElementById('game-frame');
  setTimeout(() => {
    const fw = frame.contentWindow;
    const fd = frame.contentDocument;

    // Start the 3D game by dismissing the landing toggle (T-RETRO-INTEGRATE #29).
    try {
      if (fd.getElementById('landing') && typeof fw.chooseMode === 'function') {
        fw.chooseMode('3d');
      }
    } catch(e) { log(`Start game: ${e.message}`, 'fail'); }

    // Test 1: Page loaded
    try { log(`Page loads`, fd ? 'pass' : 'fail'); }
    catch(e) { log(`Page loads: ${e.message}`, 'fail'); }

    // Test 2: Three.js loaded
    try {
      const three = fw.THREE;
      log(`THREE.js available`, three ? 'pass' : 'pending');
    } catch(e) { log(`THREE.js: ${e.message}`, 'fail'); }

    // Test 3: Game canvas exists
    try {
      const canvas = fd.getElementById('game-canvas');
      log(`Canvas element exists`, canvas ? 'pass' : 'fail');
    } catch(e) { log(`Canvas: ${e.message}`, 'fail'); }

    // Test 4: HUD elements present
    const hudIds = ['hud', 'modes', 'controls', 'radar', 'speed', 'temp', 'weather-icon'];
    hudIds.forEach(id => {
      try {
        const el = fd.getElementById(id);
        log(`HUD element #${id}`, el ? 'pass' : 'fail');
      } catch(e) { log(`HUD #${id}: ${e.message}`, 'fail'); }
    });

    // Test 5: Mode buttons (single cycle button since T-RETRO-INTEGRATE #29)
    try {
      const btns = fd.querySelectorAll('.mode-btn');
      log(`Mode buttons (${btns.length} found)`, btns.length === 1 ? 'pass' : 'fail');
    } catch(e) { log(`Mode buttons: ${e.message}`, 'fail'); }

    // Test 6: Camera mode buttons (single cycle button since T-RETRO-INTEGRATE #29)
    try {
      const btns = fd.querySelectorAll('.cam-btn');
      log(`Camera buttons (${btns.length} found)`, btns.length === 1 ? 'pass' : 'fail');
    } catch(e) { log(`Camera buttons: ${e.message}`, 'fail'); }

    // Test 7: Radar canvas
    try {
      const rc = fd.getElementById('radar-canvas');
      log(`Radar canvas exists`, rc && rc.width === 180 ? 'pass' : 'fail');
    } catch(e) { log(`Radar: ${e.message}`, 'fail'); }

    // Test 8: CSS viewport
    try {
      const meta = fd.querySelector('meta[name=viewport]');
      log(`Viewport meta tag`, meta && meta.content.includes('maximum-scale') ? 'pass' : 'fail');
    } catch(e) { log(`Viewport: ${e.message}`, 'fail'); }

    // Test 9: Import map
    try {
      const imap = fd.querySelector('script[type=importmap]');
      log(`Import map present`, imap && imap.textContent.includes('three') ? 'pass' : 'fail');
    } catch(e) { log(`Import map: ${e.message}`, 'fail'); }

    // Test 10: Touch-action none on body
    try {
      const bodyStyle = fd.defaultView.getComputedStyle(fd.body);
      log(`Body touch-action: none`, bodyStyle.touchAction === 'none' ? 'pass' : 'fail');
    } catch(e) { log(`touch-action: ${e.message}`, 'fail'); }

    // Test 11: Controls visible (not hidden by media query)
    try {
      const controls = fd.getElementById('controls');
      const style = fd.defaultView.getComputedStyle(controls);
      log(`Controls display not hidden`, style.display !== 'none' ? 'pass' : 'fail');
    } catch(e) { log(`Controls: ${e.message}`, 'fail'); }

    // Test 12: Weather API (async — just check HUD updates)
    setTimeout(() => {
      try {
        const temp = fd.getElementById('temp').textContent;
        log(`Weather HUD populated`, temp && !temp.includes('—') ? 'pass' : 'pending (still loading)');
      } catch(e) { log(`Weather HUD: ${e.message}`, 'fail'); }
      updateSummary();
    }, 3000);

    // Test 13: Boat physics research doc (T-PHYS-RESEARCH-BOAT #18)
    fetch('/research/PHYSICS-BOAT.md').then(r => r.text()).then(text => {
      const required = [
        'Current-State Audit',
        'Proposed Model',
        'BOAT_PHYSICS',
        'Docking',
        'Implementation Plan',
        '60fps',
        'maxSpeed',
        'dragQuadratic',
        'rudderRate',
        'waveResponse',
        'dockSpeed'
      ];
      required.forEach(term => {
        log(`Research doc mentions "${term}"`, text.includes(term) ? 'pass' : 'fail');
      });
      updateSummary();
    }).catch(e => {
      log(`Research doc fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test 14: Plane physics research doc (T-PHYS-RESEARCH-PLANE #19)
    fetch('/research/PHYSICS-PLANE.md').then(r => r.text()).then(text => {
      const required = [
        'Current-State Audit',
        'Proposed Model',
        'PLANE_PHYSICS',
        'Stall',
        'Airspeed',
        'Takeoff',
        'Landing',
        'Implementation Plan',
        '60fps',
        'stallSpeed',
        'thrust',
        'lift',
        'climbRate',
        'bankAngle'
      ];
      required.forEach(term => {
        log(`Plane research doc mentions "${term}"`, text.includes(term) ? 'pass' : 'fail');
      });
      updateSummary();
    }).catch(e => {
      log(`Plane research doc fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test 15: PLANE_PHYSICS constants object (T-PHYS-IMPLEMENT-PLANE #22)
    try {
      const pp = fw.PLANE_PHYSICS;
      const requiredKeys = [
        'maxSpeed', 'stallSpeed', 'thrust', 'dragLinear', 'dragQuadratic', 'idleThrottle',
        'liftCoeff', 'stallNoseDrop', 'stallRecoverThrottle', 'stallRecoverRate',
        'climbRate', 'climbThrottleFactor', 'maxClimbAngle', 'maxDescendAngle', 'autoLevelRate',
        'bankRate', 'maxBankAngle', 'turnRadiusMin', 'turnRadiusMax', 'turnAltitudeLoss',
        'groundRollSpeed', 'rotatePitch', 'climbOutAlt',
        'approachAlt', 'approachSpeed', 'flareAlt', 'flarePitch', 'touchdownSpeed',
        'gearDrag', 'goAroundThrottle'
      ];
      log(`PLANE_PHYSICS object exists`, !!pp ? 'pass' : 'fail');
      requiredKeys.forEach(k => {
        log(`PLANE_PHYSICS.${k} defined`, pp && typeof pp[k] === 'number' ? 'pass' : 'fail');
      });
      log(`PLANE_PHYSICS.gearDown is boolean`, pp && typeof pp.gearDown === 'boolean' ? 'pass' : 'fail');
      // Sanity relationships
      log(`stallSpeed < maxSpeed`, pp && pp.stallSpeed < pp.maxSpeed ? 'pass' : 'fail');
      log(`groundRollSpeed < stallSpeed`, pp && pp.groundRollSpeed < pp.stallSpeed ? 'pass' : 'fail');
      log(`climbRate > 0`, pp && pp.climbRate > 0 ? 'pass' : 'fail');
      log(`maxClimbAngle in (0, π/2)`, pp && pp.maxClimbAngle > 0 && pp.maxClimbAngle < Math.PI / 2 ? 'pass' : 'fail');
      log(`maxBankAngle in (0, π/2)`, pp && pp.maxBankAngle > 0 && pp.maxBankAngle < Math.PI / 2 ? 'pass' : 'fail');
      log(`turnAltitudeLoss >= 0`, pp && pp.turnAltitudeLoss >= 0 ? 'pass' : 'fail');
      log(`approachAlt > flareAlt > 0`, pp && pp.approachAlt > pp.flareAlt && pp.flareAlt > 0 ? 'pass' : 'fail');
      log(`touchdownSpeed < stallSpeed`, pp && pp.touchdownSpeed < pp.stallSpeed ? 'pass' : 'fail');
      updateSummary();
    } catch(e) {
      log(`PLANE_PHYSICS: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 16: Plane state variables + takeoff phase (T-PHYS-IMPLEMENT-PLANE #22)
    try {
      log(`planePhase state var exists`, typeof fw.planePhase !== 'undefined' ? 'pass' : 'fail');
      log(`planePhaseT state var exists`, typeof fw.planePhaseT !== 'undefined' ? 'pass' : 'fail');
      log(`pitch state var exists`, typeof fw.pitch !== 'undefined' ? 'pass' : 'fail');
      log(`bankAngle state var exists`, typeof fw.bankAngle !== 'undefined' ? 'pass' : 'fail');
      log(`throttle state var exists`, typeof fw.throttle !== 'undefined' ? 'pass' : 'fail');
      log(`old takeoff ramp removed (planeTakeoffT gone)`, typeof fw.planeTakeoffT === 'undefined' ? 'pass' : 'fail');
      updateSummary();
    } catch(e) {
      log(`Plane state vars: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 17: Plane physics branch still wired to terrain + shadow (T-PHYS-IMPLEMENT-PLANE #22)
    try {
      // Fetch the source to confirm the fly branch references terrain + shadow
      fetch('/index.html').then(r => r.text()).then(text => {
        const flyBlock = text.slice(text.indexOf("if (vehicleMode === 'fly')"));
        log(`Fly branch references getTerrainHeight`, flyBlock.includes('getTerrainHeight') ? 'pass' : 'fail');
        log(`Fly branch references planeShadow`, flyBlock.includes('planeShadow') ? 'pass' : 'fail');
        log(`Fly branch references PLANE_PHYSICS`, flyBlock.includes('PLANE_PHYSICS') ? 'pass' : 'fail');
        log(`Fly branch references planePhase`, flyBlock.includes('planePhase') ? 'pass' : 'fail');
        log(`Fly branch references stall`, flyBlock.toLowerCase().includes('stall') ? 'pass' : 'fail');
        log(`Fly branch references throttle`, flyBlock.includes('throttle') ? 'pass' : 'fail');
        updateSummary();
      }).catch(e => {
        log(`Fly branch source: ${e.message}`, 'fail');
        updateSummary();
      });
    } catch(e) {
      log(`Fly branch: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 18: BOAT_PHYSICS constants object (T-PHYS-IMPLEMENT-BOAT #21)
    try {
      const bp = fw.BOAT_PHYSICS;
      const requiredKeys = [
        'maxSpeed', 'accel', 'reverseAccel', 'planingSpeed', 'planingBoost',
        'dragLinear', 'dragQuadratic', 'idleFriction',
        'rudderRate', 'turnRadiusMin', 'turnRadiusMax', 'drift', 'driftDecay',
        'waveBobAmp', 'waveBobSpeed', 'wavePitchAmp', 'waveRollAmp', 'waveResponse', 'waveSpeedScale',
        'dockSpeed', 'dockRudderBoost', 'dockReverseBoost', 'fenderRange'
      ];
      log(`BOAT_PHYSICS object exists`, !!bp ? 'pass' : 'fail');
      requiredKeys.forEach(k => {
        log(`BOAT_PHYSICS.${k} defined`, bp && typeof bp[k] === 'number' ? 'pass' : 'fail');
      });
      // Sanity relationships
      log(`boat maxSpeed < car MAX_SPEED (80)`, bp && bp.maxSpeed < 80 ? 'pass' : 'fail');
      log(`reverseAccel < accel`, bp && bp.reverseAccel < bp.accel ? 'pass' : 'fail');
      log(`planingSpeed < maxSpeed`, bp && bp.planingSpeed < bp.maxSpeed ? 'pass' : 'fail');
      log(`planingBoost > 1`, bp && bp.planingBoost > 1 ? 'pass' : 'fail');
      log(`dragQuadratic > 0`, bp && bp.dragQuadratic > 0 ? 'pass' : 'fail');
      log(`dockRudderBoost > 1`, bp && bp.dockRudderBoost > 1 ? 'pass' : 'fail');
      log(`dockReverseBoost > 1`, bp && bp.dockReverseBoost > 1 ? 'pass' : 'fail');
      log(`waveResponse in [0,1]`, bp && bp.waveResponse >= 0 && bp.waveResponse <= 1 ? 'pass' : 'fail');
      log(`drift in [0,1]`, bp && bp.drift >= 0 && bp.drift <= 1 ? 'pass' : 'fail');
      log(`dockSpeed > 0`, bp && bp.dockSpeed > 0 ? 'pass' : 'fail');
      log(`fenderRange > 0`, bp && bp.fenderRange > 0 ? 'pass' : 'fail');
      updateSummary();
    } catch(e) {
      log(`BOAT_PHYSICS: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 19: Boat physics branch wired to terrain, waves, docking (T-PHYS-IMPLEMENT-BOAT #21)
    try {
      fetch('/index.html').then(r => r.text()).then(text => {
        const boatBlock = text.slice(text.indexOf("else if (vehicleMode === 'boat')"));
        log(`Boat branch references getTerrainHeight`, boatBlock.includes('getTerrainHeight') ? 'pass' : 'fail');
        log(`Boat branch references tideLevel`, boatBlock.includes('tideLevel') ? 'pass' : 'fail');
        log(`Boat branch references BOAT_PHYSICS`, boatBlock.includes('BOAT_PHYSICS') ? 'pass' : 'fail');
        log(`Boat branch references marinaBerths`, boatBlock.includes('marinaBerths') ? 'pass' : 'fail');
        log(`Boat branch references wakeTrailLine`, boatBlock.includes('wakeTrailLine') ? 'pass' : 'fail');
        log(`Boat branch has planing logic`, boatBlock.includes('planing') ? 'pass' : 'fail');
        log(`Boat branch has docking logic`, boatBlock.includes('dock') ? 'pass' : 'fail');
        log(`Boat branch has drag logic`, boatBlock.includes('drag') ? 'pass' : 'fail');
        log(`Boat branch has rudder logic`, boatBlock.includes('rudder') ? 'pass' : 'fail');
        updateSummary();
      }).catch(e => {
        log(`Boat branch source: ${e.message}`, 'fail');
        updateSummary();
      });
    } catch(e) {
      log(`Boat branch: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 20: PHYS constants object (T-PHYS-IMPLEMENT-CAR #20)
    try {
      const ph = fw.PHYS;
      const requiredKeys = [
        'maxSpeed', 'accel', 'brake', 'reverseAccel', 'engineBrake',
        'grip', 'corneringStiffness', 'maxSlipAngle',
        'handbrakeGrip', 'driftFactor',
        'weightTransfer', 'rollFactor',
        'turnRate', 'speedSteerFalloff',
        'springStiffness', 'springDamping', 'bodyRoll', 'bodyPitch'
      ];
      log(`PHYS object exists`, !!ph ? 'pass' : 'fail');
      requiredKeys.forEach(k => {
        log(`PHYS.${k} defined`, ph && typeof ph[k] === 'number' ? 'pass' : 'fail');
      });
      // Sanity relationships
      log(`grip in (0,1]`, ph && ph.grip > 0 && ph.grip <= 1 ? 'pass' : 'fail');
      log(`handbrakeGrip < grip`, ph && ph.handbrakeGrip < ph.grip ? 'pass' : 'fail');
      log(`weightTransfer in (0,0.5)`, ph && ph.weightTransfer > 0 && ph.weightTransfer < 0.5 ? 'pass' : 'fail');
      log(`maxSlipAngle > 0`, ph && ph.maxSlipAngle > 0 ? 'pass' : 'fail');
      log(`corneringStiffness > 0`, ph && ph.corneringStiffness > 0 ? 'pass' : 'fail');
      log(`springStiffness > 0`, ph && ph.springStiffness > 0 ? 'pass' : 'fail');
      log(`springDamping > 0`, ph && ph.springDamping > 0 ? 'pass' : 'fail');
      log(`bodyRoll > 0`, ph && ph.bodyRoll > 0 ? 'pass' : 'fail');
      log(`bodyPitch > 0`, ph && ph.bodyPitch > 0 ? 'pass' : 'fail');
      log(`maxSpeed == 80 (car top speed preserved)`, ph && ph.maxSpeed === 80 ? 'pass' : 'fail');
      updateSummary();
    } catch(e) {
      log(`PHYS: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 21: Car physics state variables (T-PHYS-IMPLEMENT-CAR #20)
    try {
      log(`vForward state var exists`, typeof fw.vForward !== 'undefined' ? 'pass' : 'fail');
      log(`vLateral state var exists`, typeof fw.vLateral !== 'undefined' ? 'pass' : 'fail');
      log(`carSpeed still exists (compat)`, typeof fw.carSpeed !== 'undefined' ? 'pass' : 'fail');
      updateSummary();
    } catch(e) {
      log(`Car state vars: ${e.message}`, 'fail');
      updateSummary();
    }

    // Test 22: Car physics branch wired to grip model (T-PHYS-IMPLEMENT-CAR #20)
    try {
      fetch('/index.html').then(r => r.text()).then(text => {
        const driveBlock = text.slice(text.indexOf("if (vehicleMode === 'drive')"));
        log(`Drive branch references PHYS`, driveBlock.includes('PHYS') ? 'pass' : 'fail');
        log(`Drive branch references vForward`, driveBlock.includes('vForward') ? 'pass' : 'fail');
        log(`Drive branch references vLateral`, driveBlock.includes('vLateral') ? 'pass' : 'fail');
        log(`Drive branch has drift logic`, driveBlock.toLowerCase().includes('drift') ? 'pass' : 'fail');
        log(`Drive branch has grip logic`, driveBlock.toLowerCase().includes('grip') ? 'pass' : 'fail');
        log(`Drive branch has weight transfer`, driveBlock.toLowerCase().includes('weighttransfer') || driveBlock.toLowerCase().includes('weight transfer') ? 'pass' : 'fail');
        log(`Drive branch has suspension logic`, driveBlock.toLowerCase().includes('suspension') ? 'pass' : 'fail');
        log(`Drive branch has slip angle`, driveBlock.toLowerCase().includes('slip') ? 'pass' : 'fail');
        log(`Drive branch has handbrake`, driveBlock.toLowerCase().includes('handbrake') ? 'pass' : 'fail');
        updateSummary();
      }).catch(e => {
        log(`Drive branch source: ${e.message}`, 'fail');
        updateSummary();
      });
    } catch(e) {
      log(`Drive branch: ${e.message}`, 'fail');
      updateSummary();
    }
    // Test 15: Garage system research doc (T-GARAGE-RESEARCH #23) (T-GARAGE-RESEARCH #23)
    fetch('/research/GARAGE.md').then(r => r.text()).then(text => {
      const required = [
        'Current-State Audit',
        'Vehicle roster',
        'Stat model',
        'Garage UI',
        'Persistence',
        'Unlock',
        'Tuning knobs',
        'Implementation Plan',
        '60fps',
        'applyMode',
        'createCar',
        'createBoat',
        'createPlane',
        'hatchback',
        'sports',
        'truck',
        'speedboat',
        'cruiser',
        'fishing',
        'Cessna',
        'stunt',
        'jet'
      ];
      required.forEach(term => {
        log(`Garage research doc mentions "${term}"`, text.includes(term) ? 'pass' : 'fail');
      });
      updateSummary();
    }).catch(e => {
      log(`Garage research doc fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test 16: Vehicle roster + stat model (T-GARAGE-ROSTER #30)
    try {
      const V = fw.VEHICLES;
      log(`VEHICLES registry exists`, !!V ? 'pass' : 'fail');
      if (V) {
        const ids = Object.keys(V);
        log(`VEHICLES has 9 vehicles`, ids.length === 9 ? 'pass' : `fail (${ids.length})`);

        const byMode = { drive: [], boat: [], fly: [] };
        ids.forEach(id => { const v = V[id]; if (v && byMode[v.mode]) byMode[v.mode].push(id); });
        log(`3 vehicles per mode (drive)`, byMode.drive.length === 3 ? 'pass' : `fail (${byMode.drive.length})`);
        log(`3 vehicles per mode (boat)`, byMode.boat.length === 3 ? 'pass' : `fail (${byMode.boat.length})`);
        log(`3 vehicles per mode (fly)`, byMode.fly.length === 3 ? 'pass' : `fail (${byMode.fly.length})`);

        const hasConfig = ids.every(id => V[id] && V[id].mode && V[id].name && V[id].color !== undefined && V[id].stats && typeof V[id].stats === 'object');
        log(`Every vehicle has mode/name/color/stats`, hasConfig ? 'pass' : 'fail');

        // Stat relationships — distinct profiles
        const h = V.hatchback, s = V.sports, t = V.truck;
        log(`sports faster than hatchback`, s.stats.maxSpeed > h.stats.maxSpeed ? 'pass' : 'fail');
        log(`truck slower than hatchback`, t.stats.maxSpeed < h.stats.maxSpeed ? 'pass' : 'fail');
        log(`truck heavier than hatchback`, t.stats.weight > h.stats.weight ? 'pass' : 'fail');
        log(`sports drifts more than hatchback`, s.stats.drift > h.stats.drift ? 'pass' : 'fail');
        log(`sports lower grip than hatchback`, s.stats.grip < h.stats.grip ? 'pass' : 'fail');

        const c = V.cruiser, sp = V.speedboat, f = V.fishing;
        log(`speedboat faster than cruiser`, sp.stats.maxSpeed > c.stats.maxSpeed ? 'pass' : 'fail');
        log(`fishing slower than cruiser`, f.stats.maxSpeed < c.stats.maxSpeed ? 'pass' : 'fail');

        const ce = V.cessna, st = V.stunt, j = V.jet;
        log(`jet faster than cessna`, j.stats.maxSpeed > ce.stats.maxSpeed ? 'pass' : 'fail');
        log(`stunt lower stall than cessna`, st.stats.stallSpeed < ce.stats.stallSpeed ? 'pass' : 'fail');

        // Defaults match current constants (behaviour preserved)
        log(`hatchback maxSpeed matches current (80)`, h.stats.maxSpeed === 80 ? 'pass' : `fail (${h.stats.maxSpeed})`);
        log(`hatchback accel matches current (30)`, h.stats.accel === 30 ? 'pass' : `fail (${h.stats.accel})`);
        log(`hatchback turnRate matches current (3.0)`, h.stats.turnRate === 3.0 ? 'pass' : `fail (${h.stats.turnRate})`);

        // resolveVehicleStats — default preserves behaviour
        const P = fw.resolveVehicleStats('drive');
        log(`resolveVehicleStats('drive') returns maxSpeed 80`, P.maxSpeed === 80 ? 'pass' : `fail (${P.maxSpeed})`);
        log(`resolveVehicleStats('drive') returns accel 30`, P.accel === 30 ? 'pass' : `fail (${P.accel})`);

        // resolveVehicleStats reflects currentVehicle override
        const prev = fw.currentVehicle;
        fw.currentVehicle = V.sports;
        const Ps = fw.resolveVehicleStats('drive');
        log(`resolveVehicleStats reflects sports override (maxSpeed 110)`, Ps.maxSpeed === 110 ? 'pass' : `fail (${Ps.maxSpeed})`);
        fw.currentVehicle = prev;
      }
    } catch(e) { log(`Vehicle roster: ${e.message}`, 'fail'); }
    updateSummary();

  }, 2000);
});

// ====== RETRO MODE TESTS (T-RETRO-FORK #25) ======
// index-retro.html must be a copy of index.html with Three.js/WebGL stripped
// but all game logic preserved, plus a placeholder Canvas 2D renderer stub.
window.addEventListener('load', () => {
  const frame = document.getElementById('retro-frame');
  setTimeout(() => {
    const fw = frame.contentWindow;
    const fd = frame.contentDocument;

    // Test R1: index-retro.html loads without JS errors
    try {
      log(`[retro] Page loads`, fd ? 'pass' : 'fail');
    } catch(e) { log(`[retro] Page loads: ${e.message}`, 'fail'); }

    // Test R2: No Three.js import map
    fetch('/index-retro.html').then(r => r.text()).then(text => {
      log(`[retro] No import map with three`, !/importmap[\s\S]*"three"/.test(text) ? 'pass' : 'fail');
      log(`[retro] No 'import * as THREE'`, !text.includes("import * as THREE from 'three'") ? 'pass' : 'fail');
      log(`[retro] No three/addons imports`, !text.includes('three/addons') ? 'pass' : 'fail');
      log(`[retro] No WebGLRenderer instantiation`, !/new THREE\.WebGLRenderer/.test(text) ? 'pass' : 'fail');
      log(`[retro] Canvas 2D renderer stub present`, text.includes('retroRender') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (PHYS)`, text.includes('const PHYS') || text.includes('PHYS =') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (PLANE_PHYSICS)`, text.includes('PLANE_PHYSICS') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (BOAT_PHYSICS)`, text.includes('BOAT_PHYSICS') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (missions)`, text.includes('startMission') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (wanted level)`, text.includes('setWantedLevel') ? 'pass' : 'fail');
      log(`[retro] Game logic preserved (leaderboard)`, text.includes('fetchLeaderboard') ? 'pass' : 'fail');
      log(`[retro] Road data loaded`, text.includes('jersey-roads.js') ? 'pass' : 'fail');
      updateSummary();
    }).catch(e => {
      log(`[retro] Source fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test R3: Runtime — game logic present + Canvas 2D stub active
    try {
      log(`[retro] THREE shim available`, typeof fw.THREE !== 'undefined' ? 'pass' : 'fail');
