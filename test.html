<!DOCTYPE html>
<html>
<head><title>Vibe Drive Jersey — Tests</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  .pass { color: #0f0; } .fail { color: #f00; } .pending { color: #fa0; }
  #results { white-space: pre; }
</style></head>
<body>
<h2>⚡ Vibe Drive Jersey 3D — Automated Tests</h2>
<div id="results">Running tests...</div>
<iframe id="game-frame" src="/index.html" style="display:none;"></iframe>
<script>
const results = [];
let passCount = 0, failCount = 0;

function log(msg, status) {
  const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⏳';
  results.push(`${icon} ${msg}`);
  if (status === 'pass') passCount++;
  if (status === 'fail') failCount++;
  document.getElementById('results').textContent = results.join('\n');
}

function updateSummary() {
  results.push(`\n--- ${passCount} passed, ${failCount} failed ---`);
  document.getElementById('results').textContent = results.join('\n');
}

// Wait for iframe to load, then run tests
window.addEventListener('load', () => {
  const frame = document.getElementById('game-frame');
  setTimeout(() => {
    const fw = frame.contentWindow;
    const fd = frame.contentDocument;

    // Test 1: Page loaded
    try { log(`Page loads`, fd ? 'pass' : 'fail'); }
    catch(e) { log(`Page loads: ${e.message}`, 'fail'); }

    // Test 2: Three.js loaded
    try {
      const three = fw.THREE;
      log(`THREE.js available`, three ? 'pass' : 'pending');
    } catch(e) { log(`THREE.js: ${e.message}`, 'fail'); }

    // Test 3: Game canvas exists
    try {
      const canvas = fd.getElementById('game-canvas');
      log(`Canvas element exists`, canvas ? 'pass' : 'fail');
    } catch(e) { log(`Canvas: ${e.message}`, 'fail'); }

    // Test 4: HUD elements present
    const hudIds = ['hud', 'modes', 'controls', 'radar', 'speed', 'temp', 'weather-icon'];
    hudIds.forEach(id => {
      try {
        const el = fd.getElementById(id);
        log(`HUD element #${id}`, el ? 'pass' : 'fail');
      } catch(e) { log(`HUD #${id}: ${e.message}`, 'fail'); }
    });

    // Test 5: Mode buttons
    try {
      const btns = fd.querySelectorAll('.mode-btn');
      log(`Mode buttons (${btns.length} found)`, btns.length === 3 ? 'pass' : 'fail');
    } catch(e) { log(`Mode buttons: ${e.message}`, 'fail'); }

    // Test 6: Camera mode buttons
    try {
      const btns = fd.querySelectorAll('.cam-btn');
      log(`Camera buttons (${btns.length} found)`, btns.length === 4 ? 'pass' : 'fail');
    } catch(e) { log(`Camera buttons: ${e.message}`, 'fail'); }

    // Test 7: Radar canvas
    try {
      const rc = fd.getElementById('radar-canvas');
      log(`Radar canvas exists`, rc && rc.width === 180 ? 'pass' : 'fail');
    } catch(e) { log(`Radar: ${e.message}`, 'fail'); }

    // Test 8: CSS viewport
    try {
      const meta = fd.querySelector('meta[name=viewport]');
      log(`Viewport meta tag`, meta && meta.content.includes('maximum-scale') ? 'pass' : 'fail');
    } catch(e) { log(`Viewport: ${e.message}`, 'fail'); }

    // Test 9: Import map
    try {
      const imap = fd.querySelector('script[type=importmap]');
      log(`Import map present`, imap && imap.textContent.includes('three') ? 'pass' : 'fail');
    } catch(e) { log(`Import map: ${e.message}`, 'fail'); }

    // Test 10: Touch-action none on body
    try {
      const bodyStyle = fd.defaultView.getComputedStyle(fd.body);
      log(`Body touch-action: none`, bodyStyle.touchAction === 'none' ? 'pass' : 'fail');
    } catch(e) { log(`touch-action: ${e.message}`, 'fail'); }

    // Test 11: Controls visible (not hidden by media query)
    try {
      const controls = fd.getElementById('controls');
      const style = fd.defaultView.getComputedStyle(controls);
      log(`Controls display not hidden`, style.display !== 'none' ? 'pass' : 'fail');
    } catch(e) { log(`Controls: ${e.message}`, 'fail'); }

    // Test 12: Weather API (async — just check HUD updates)
    setTimeout(() => {
      try {
        const temp = fd.getElementById('temp').textContent;
        log(`Weather HUD populated`, temp && !temp.includes('—') ? 'pass' : 'pending (still loading)');
      } catch(e) { log(`Weather HUD: ${e.message}`, 'fail'); }
      updateSummary();
    }, 3000);

    // Test 13: Boat physics research doc (T-PHYS-RESEARCH-BOAT #18)
    fetch('/research/PHYSICS-BOAT.md').then(r => r.text()).then(text => {
      const required = [
        'Current-State Audit',
        'Proposed Model',
        'BOAT_PHYSICS',
        'Docking',
        'Implementation Plan',
        '60fps',
        'maxSpeed',
        'dragQuadratic',
        'rudderRate',
        'waveResponse',
        'dockSpeed'
      ];
      required.forEach(term => {
        log(`Research doc mentions "${term}"`, text.includes(term) ? 'pass' : 'fail');
      });
      updateSummary();
    }).catch(e => {
      log(`Research doc fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test 14: Garage system research doc (T-GARAGE-RESEARCH #23)
    fetch('/research/GARAGE.md').then(r => r.text()).then(text => {
      const required = [
        'Current-State Audit',
        'Vehicle roster',
        'Stat model',
        'Garage UI',
        'Persistence',
        'Unlock',
        'Tuning knobs',
        'Implementation Plan',
        '60fps',
        'applyMode',
        'createCar',
        'createBoat',
        'createPlane',
        'hatchback',
        'sports',
        'truck',
        'speedboat',
        'cruiser',
        'fishing',
        'Cessna',
        'stunt',
        'jet'
      ];
      required.forEach(term => {
        log(`Garage research doc mentions "${term}"`, text.includes(term) ? 'pass' : 'fail');
      });
      updateSummary();
    }).catch(e => {
      log(`Garage research doc fetch: ${e.message}`, 'fail');
      updateSummary();
    });

    // Test 15: Vehicle roster + stat model (T-GARAGE-ROSTER #30)
    try {
      const V = fw.VEHICLES;
      log(`VEHICLES registry exists`, !!V ? 'pass' : 'fail');
      if (V) {
        const ids = Object.keys(V);
        log(`VEHICLES has 9 vehicles`, ids.length === 9 ? 'pass' : `fail (${ids.length})`);

        const byMode = { drive: [], boat: [], fly: [] };
        ids.forEach(id => { const v = V[id]; if (v && byMode[v.mode]) byMode[v.mode].push(id); });
        log(`3 vehicles per mode (drive)`, byMode.drive.length === 3 ? 'pass' : `fail (${byMode.drive.length})`);
        log(`3 vehicles per mode (boat)`, byMode.boat.length === 3 ? 'pass' : `fail (${byMode.boat.length})`);
        log(`3 vehicles per mode (fly)`, byMode.fly.length === 3 ? 'pass' : `fail (${byMode.fly.length})`);

        const hasConfig = ids.every(id => V[id] && V[id].mode && V[id].name && V[id].color !== undefined && V[id].stats && typeof V[id].stats === 'object');
        log(`Every vehicle has mode/name/color/stats`, hasConfig ? 'pass' : 'fail');

        // Stat relationships — distinct profiles
        const h = V.hatchback, s = V.sports, t = V.truck;
        log(`sports faster than hatchback`, s.stats.maxSpeed > h.stats.maxSpeed ? 'pass' : 'fail');
        log(`truck slower than hatchback`, t.stats.maxSpeed < h.stats.maxSpeed ? 'pass' : 'fail');
        log(`truck heavier than hatchback`, t.stats.weight > h.stats.weight ? 'pass' : 'fail');
        log(`sports drifts more than hatchback`, s.stats.drift > h.stats.drift ? 'pass' : 'fail');
        log(`sports lower grip than hatchback`, s.stats.grip < h.stats.grip ? 'pass' : 'fail');

        const c = V.cruiser, sp = V.speedboat, f = V.fishing;
        log(`speedboat faster than cruiser`, sp.stats.maxSpeed > c.stats.maxSpeed ? 'pass' : 'fail');
        log(`fishing slower than cruiser`, f.stats.maxSpeed < c.stats.maxSpeed ? 'pass' : 'fail');

        const ce = V.cessna, st = V.stunt, j = V.jet;
        log(`jet faster than cessna`, j.stats.maxSpeed > ce.stats.maxSpeed ? 'pass' : 'fail');
        log(`stunt lower stall than cessna`, st.stats.stallSpeed < ce.stats.stallSpeed ? 'pass' : 'fail');

        // Defaults match current constants (behaviour preserved)
        log(`hatchback maxSpeed matches current (80)`, h.stats.maxSpeed === 80 ? 'pass' : `fail (${h.stats.maxSpeed})`);
        log(`hatchback accel matches current (30)`, h.stats.accel === 30 ? 'pass' : `fail (${h.stats.accel})`);
        log(`hatchback turnRate matches current (3.0)`, h.stats.turnRate === 3.0 ? 'pass' : `fail (${h.stats.turnRate})`);

        // resolveVehicleStats — default preserves behaviour
        const P = fw.resolveVehicleStats('drive');
        log(`resolveVehicleStats('drive') returns maxSpeed 80`, P.maxSpeed === 80 ? 'pass' : `fail (${P.maxSpeed})`);
        log(`resolveVehicleStats('drive') returns accel 30`, P.accel === 30 ? 'pass' : `fail (${P.accel})`);

        // resolveVehicleStats reflects currentVehicle override
        const prev = fw.currentVehicle;
        fw.currentVehicle = V.sports;
        const Ps = fw.resolveVehicleStats('drive');
        log(`resolveVehicleStats reflects sports override (maxSpeed 110)`, Ps.maxSpeed === 110 ? 'pass' : `fail (${Ps.maxSpeed})`);
        fw.currentVehicle = prev;
      }
    } catch(e) { log(`Vehicle roster: ${e.message}`, 'fail'); }
    updateSummary();

  }, 2000);
});
</script>
</body>
</html>
