<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VibeDrive.je</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --jersey-green: #00A86B;
      --atlantic-blue: #0A1A3F;
      --sprint-yellow: #FFD60A;
      --rally-red: #E63946;
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-bg: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    /* ---------- Fake 3D game view ---------- */
    #game-view {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 45%, #4CAF50 45%, #2E7D32 100%);
      z-index: 0;
    }

    .sun {
      position: absolute;
      top: 8%;
      right: 18%;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFF9C4 0%, rgba(255, 214, 10, 0.6) 60%, transparent 100%);
      filter: blur(2px);
      opacity: 0.9;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      filter: blur(8px);
    }

    .cloud:nth-child(2) { top: 12%; left: 12%; width: 120px; height: 34px; }
    .cloud:nth-child(3) { top: 22%; left: 55%; width: 90px; height: 26px; opacity: 0.7; }
    .cloud:nth-child(4) { top: 8%; left: 70%; width: 70px; height: 22px; opacity: 0.6; }

    .road-wrap {
      position: absolute;
      top: 0;
      left: 50%;
      width: 260px;
      height: 100%;
      transform: translateX(-50%) perspective(360px);
    }

    .road {
      position: absolute;
      bottom: -8%;
      left: 0;
      width: 100%;
      height: 110%;
      background: #2b2b2b;
      transform: rotateX(68deg);
      transform-origin: bottom center;
      border-left: 6px solid rgba(255, 255, 255, 0.35);
      border-right: 6px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
    }

    .road-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        transparent 0,
        transparent 48px,
        rgba(255, 255, 255, 0.75) 48px,
        rgba(255, 255, 255, 0.75) 72px
      );
      animation: roadMove 0.7s linear infinite;
    }

    @keyframes roadMove {
      from { background-position: 0 0; }
      to { background-position: 0 240px; }
    }

    /* ---------- UI overlay ---------- */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #ui > * {
      pointer-events: auto;
    }

    .btn {
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44pt;
      min-height: 44pt;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:active {
      transform: scale(0.92);
    }

    /* Top-left stats */
    .top-left {
      position: absolute;
      top: max(env(safe-area-inset-top, 16px), 16px);
      left: max(env(safe-area-inset-left, 16px), 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(10, 26, 63, 0.45);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .stat-value small {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Hamburger */
    .hamburger {
      position: absolute;
      top: max(env(safe-area-inset-top, 16px), 16px);
      right: max(env(safe-area-inset-right, 16px), 16px);
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: rgba(10, 26, 63, 0.78);
      color: #fff;
      font-size: 24px;
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    /* Left dock */
    .left-dock {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      left: max(env(safe-area-inset-left, 16px), 16px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .cycle-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--glass-bg);
      color: #fff;
      font-size: 28px;
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    /* Right dock */
    .right-dock {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      right: max(env(safe-area-inset-right, 16px), 16px);
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 14px;
      z-index: 50;
    }

    .brake-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--rally-red);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.04em;
      border: 3px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 8px 28px rgba(230, 57, 70, 0.55),
        inset 0 -5px 14px rgba(0, 0, 0, 0.18);
    }

    .brake-btn:active {
      box-shadow:
        0 4px 16px rgba(230, 57, 70, 0.5),
        inset 0 -3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Radar */
    .radar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(10, 26, 63, 0.55);
      backdrop-filter: blur(12px);
      border: 2px solid var(--glass-border);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .radar-grid {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle, transparent 28%, rgba(255, 255, 255, 0.12) 29%, transparent 30%),
        radial-gradient(circle, transparent 58%, rgba(255, 255, 255, 0.12) 59%, transparent 60%);
      border-radius: 50%;
    }

    .radar-sweep {
      position: absolute;
      inset: 0;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 168, 107, 0.45) 70deg, transparent 71deg);
      border-radius: 50%;
      animation: radar-spin 2.2s linear infinite;
    }

    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-blip {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sprint-yellow);
      box-shadow: 0 0 8px var(--sprint-yellow);
      animation: blip-pulse 1.6s ease-in-out infinite;
    }

    .radar-blip:nth-of-type(3) { animation-delay: 0s; }
    .radar-blip:nth-of-type(4) { animation-delay: 0.8s; }

    @keyframes blip-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Menu overlay & panel */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 150;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    #menu-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(320px, 82vw);
      height: 100%;
      background: rgba(10, 26, 63, 0.9);
      backdrop-filter: blur(24px);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
      padding:
        calc(env(safe-area-inset-top, 16px) + 80px)
        22px
        max(env(safe-area-inset-bottom, 16px), 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: -10px 0 44px rgba(0, 0, 0, 0.45);
    }

    #menu-panel.open {
      transform: translateX(0);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 44pt;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .menu-item .icon {
      font-size
