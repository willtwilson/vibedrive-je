<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VibeDrive.je</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --jersey-green: #00A86B;
      --atlantic-blue: #0A1A3F;
      --sprint-yellow: #FFD60A;
      --rally-red: #E63946;
      --glass-bg: rgba(10, 26, 63, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.06);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ============================================
       3D BACKGROUND — Fake driving view
       ============================================ */
    .game-viewport {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    /* Sky */
    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        #87CEEB 0%,
        #A8D8EA 35%,
        #C8E6C9 55%,
        #A5D6A7 70%,
        #81C784 85%,
        #66BB6A 100%
      );
    }

    /* Horizon glow */
    .horizon-glow {
      position: absolute;
      top: 52%;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(180deg,
        rgba(255, 246, 213, 0.35) 0%,
        rgba(255, 246, 213, 0.05) 100%
      );
      filter: blur(20px);
      pointer-events: none;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 18%;
      right: 22%;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFF8E1 0%, #FFD60A 40%, #FFB300 100%);
      box-shadow:
        0 0 30px rgba(255, 214, 10, 0.4),
        0 0 80px rgba(255, 214, 10, 0.15);
      animation: sunPulse 6s ease-in-out infinite;
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.92; }
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50px;
      filter: blur(1px);
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50px;
    }

    .cloud-1 {
      top: 14%;
      left: 12%;
      width: 90px;
      height: 22px;
      animation: cloudDrift1 35s linear infinite;
    }
    .cloud-1::before { width: 50px; height: 32px; top: -14px; left: 14px; }
    .cloud-1::after { width: 36px; height: 24px; top: -8px; left: 48px; }

    .cloud-2 {
      top: 22%;
      right: 30%;
      width: 70px;
      height: 18px;
      animation: cloudDrift2 45s linear infinite;
    }
    .cloud-2::before { width: 40px; height: 26px; top: -10px; left: 10px; }
    .cloud-2::after { width: 30px; height: 20px; top: -6px; left: 36px; }

    .cloud-3 {
      top: 10%;
      left: 55%;
      width: 60px;
      height: 16px;
      animation: cloudDrift3 50s linear infinite;
    }
    .cloud-3::before { width: 34px; height: 22px; top: -9px; left: 8px; }
    .cloud-3::after { width: 26px; height: 18px; top: -5px; left: 30px; }

    @keyframes cloudDrift1 {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(calc(100vw + 120px)); }
    }
    @keyframes cloudDrift2 {
      0% { transform: translateX(80px); }
      100% { transform: translateX(calc(-100vw - 80px)); }
    }
    @keyframes cloudDrift3 {
      0% { transform: translateX(-80px); }
      100% { transform: translateX(calc(100vw + 80px)); }
    }

    /* Distant hills */
    .hills-far {
      position: absolute;
      bottom: 38%;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(180deg,
        #7CB342 0%,
        #689F38 50%,
        #558B2F 100%
      );
      clip-path: polygon(
        0% 100%,
        0% 55%,
        8% 40%,
        18% 48%,
        28% 32%,
        40% 45%,
        52% 28%,
        65% 42%,
        78% 30%,
        90% 50%,
        100% 38%,
        100% 100%
      );
      opacity: 0.7;
    }

    .hills-near {
      position: absolute;
      bottom: 32%;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(180deg,
        #8BC34A 0%,
        #7CB342 50%,
        #689F38 100%
      );
      clip-path: polygon(
        0% 100%,
        0% 60%,
        12% 45%,
        25% 55%,
        38% 35%,
        50% 50%,
        62% 30%,
        75% 48%,
        88% 38%,
        100% 55%,
        100% 100%
      );
      opacity: 0.85;
    }

    /* Road */
    .road-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 45%;
      perspective: 500px;
      overflow: hidden;
    }

    .road-surface {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotateX(55deg);
      transform-origin: bottom center;
      width: 280px;
      height: 600px;
      background: linear-gradient(180deg,
        #4A4A4A 0%,
        #3D3D3D 30%,
        #333333 60%,
        #2A2A2A 100%
      );
    }

    .road-edge-left,
    .road-edge-right {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 600px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.2) 100%
      );
      transform-origin: bottom center;
      transform: rotateX(55deg);
    }

    .road-edge-left {
      left: calc(50% - 140px);
      transform: translateX(-50%) rotateX(55deg);
    }

    .road-edge-right {
      left: calc(50% + 140px);
      transform: translateX(-50%) rotateX(55deg);
    }

    /* Road center line */
    .road-center {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotateX(55deg);
      transform-origin: bottom center;
      width: 3px;
      height: 600px;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.7) 0px,
        rgba(255, 255, 255, 0.7) 28px,
        transparent 28px,
        transparent 56px
      );
      animation: roadScroll 0.6s linear infinite;
    }

    @keyframes roadScroll {
      0% { background-position: 0 0; }
      100% { background-position: 0 56px; }
    }

    /* Side stripes */
    .side-stripe {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 600px;
      transform-origin: bottom center;
      transform: rotateX(55deg);
      background: repeating-linear-gradient(
        180deg,
        var(--sprint-yellow) 0px,
        var(--sprint-yellow) 18px,
        transparent 18px,
        transparent 36px
      );
      animation: roadScroll 0.4s linear infinite;
    }

    .side-stripe-left {
      left: calc(50% - 130px);
      transform: translateX(-50%) rotateX(55deg);
    }

    .side-stripe-right {
      left: calc(50% + 130px);
      transform: translateX(-50%) rotateX(55deg);
    }

    /* Ground plane */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38%;
      background: linear-gradient(180deg,
        #66BB6A 0%,
        #4CAF50 30%,
        #43A047 60%,
        #388E3C 100%
      );
    }

    /* Ground texture — subtle grid */
    .ground::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Road shoulder */
    .shoulder-left,
    .shoulder-right {
      position: absolute;
      bottom: 0;
      width: calc(50% - 145px);
      height: 38%;
      background: linear-gradient(180deg,
        #5D4037 0%,
        #4E342E 50%,
        #3E2723 100%
      );
    }

    .shoulder-left { left: 0; }
    .shoulder-right { right: 0; }

    /* Jersey landmark hint — distant tower */
    .landmark {
      position: absolute;
      bottom: 42%;
      left: 68%;
      width: 6px;
      height: 50px;
      background: linear-gradient(180deg, #B0BEC5 0%, #78909C 100%);
      border-radius: 1px;
      opacity: 0.5;
    }

    .landmark::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -3px;
      width: 12px;
      height: 6px;
      background: #CFD8DC;
      border-radius: 2px 2px 0 0;
    }

    /* Wind streaks for speed feel */
    .wind-streaks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .wind-streak {
      position: absolute;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
    }

    .wind-streak:nth-child(1) {
      width: 60px;
      top: 30%;
      left: -60px;
      animation: windFly 1.2s linear infinite;
      animation-delay: 0s;
    }

    .wind-streak:nth-child(2) {
      width: 40px;
      top: 45%;
      left: -40px;
      animation: windFly 0.9s linear infinite;
      animation-delay: 0.3s;
    }

    .wind-streak:nth-child(3) {
      width: 80px;
      top: 60%;
      left: -80px;
      animation: windFly 1.5s linear infinite;
      animation-delay: 0.6s;
    }

    .wind-streak:nth-child(4) {
      width: 30px;
      top: 75%;
      left: -30px;
      animation: windFly 0.7s linear infinite;
      animation-delay: 0.15s;
    }

    @keyframes windFly {
      0% { transform: translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(calc(100vw + 100px)); opacity: 0; }
    }

    /* ============================================
       UI LAYER
       ============================================ */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .ui-layer > * {
      pointer-events: auto;
    }

    /* Glass panel base */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 var(--glass-highlight);
    }

    /* ============================================
       TOP-LEFT: Score + Speed
       ============================================ */
    .hud-stats {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .stat-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .stat-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--sprint-yellow);
      text-shadow: 0 0 12px rgba(255, 214, 10, 0.25);
      transition: all 0.2s ease;
    }

    .stat-value.speed {
      font-size: 22px;
      font-weight: 700;
    }

    .stat-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      margin-left: 2px;
    }

    /* Speed bar */
    .speed-bar-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      margin-top: 4px;
      overflow: hidden;
    }

    .speed-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, var(--jersey-green), var(--sprint-yellow));
      border-radius: 1px;
      transition: width 0.5s ease;
    }

    /* ============================================
       TOP-RIGHT: Hamburger Menu
       ============================================ */
    .menu-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-btn:active {
      transform: scale(0.92);
    }

    .menu-btn:hover {
      background: rgba(10, 26, 63, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .menu-btn .bar {
      width: 20px;
      height: 2px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 2px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }

    .menu-btn.open .bar:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-btn.open .bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .menu-btn.open .bar:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ============================================
       MENU PANEL
       ============================================ */
    .menu-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      max-width: 85vw;
      height: 100%;
      z-index: 100;
      background: linear-gradient(180deg,
        rgba(10, 26, 63, 0.92) 0%,
        rgba(10, 26, 63, 0.88) 50%,
        rgba(10, 26, 63, 0.95) 100%
      );
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-left: 1px solid var(--glass-border);
      box-shadow:
        -8px 0 40px rgba(0, 0, 0, 0.4),
        inset 1px 0 0 var(--glass-highlight);
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      pointer-events: auto;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .menu-title {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .menu-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .menu-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-close svg {
      width: 16px;
      height: 16px;
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 2;
      fill: none;
    }

    .menu-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin: 4px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-item:hover::before {
      opacity: 1;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .menu-item:active {
      transform: scale(0.98);
    }

    .menu-item-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .menu-item-text {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
    }

    .menu-item-chevron {
      margin-left: auto;
      width: 16px;
      height: 16px;
      opacity: 0.3;
    }

    .menu-item-chevron svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-footer-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--jersey-green);
      letter-spacing: 0.05em;
    }

    .menu-footer-version {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
    }

    /* Menu overlay */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0);
      backdrop-filter: blur(0px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .menu-overlay.open {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    /* ============================================
       BOTTOM-LEFT: Mode + Camera buttons
       ============================================ */
    .controls-left {
      position: absolute;
      bottom: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cycle-btn {
      min-width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .cycle-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cycle-btn:hover::after {
      opacity: 1;
    }

    .cycle-btn:active {
      transform: scale(0.9);
    }

    .cycle-btn .cycle-icon {
      font-size: 22px;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .cycle-btn:active .cycle-icon {
      transform: scale(0.85) rotate(-10deg);
    }

    .cycle-btn .cycle-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ============================================
       BOTTOM-RIGHT: Brake + Radar
       ============================================ */
    .controls-right {
      position: absolute;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    /* Radar */
    .radar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }

    .radar::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, transparent 0%, transparent 18%, rgba(0, 168, 107, 0.08) 18%, rgba(0, 168, 107, 0.08) 19%, transparent 19%, transparent 38%, rgba(0, 168, 107, 0.06) 38%, rgba(0, 168, 107, 0.06) 39%, transparent 39%, transparent 58%, rgba(0, 168, 107, 0.04) 58%, rgba(0, 168, 107, 0.04) 59%, transparent 59%),
        repeating-conic-gradient(from 0deg, transparent 0deg, transparent 44deg, rgba(0, 168, 107, 0.04) 44deg, rgba(0, 168, 107, 0.04) 46deg, transparent 46deg, transparent 90deg);
    }

    .radar-sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 300deg,
        rgba(0, 168, 107, 0.25) 330deg,
        rgba(0, 168, 107, 0.45) 360deg
      );
      animation: radarSweep 3s linear infinite;
    }

    @keyframes radarSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sprint-yellow);
      box-shadow: 0 0 8px rgba(255, 214, 10, 0.5);
    }

    .radar-blip {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rally-red);
      box-shadow: 0 0 6px rgba(230, 57, 70, 0.5);
      animation: blipPulse 2s ease-in-out infinite;
    }

    .radar-blip:nth-child(3) {
      top: 28%;
      left: 62%;
      animation-delay: 0s;
    }

    .radar-blip:nth-child(4) {
      top: 55%;
      left: 72%;
      width: 4px;
      height: 4px;
      animation-delay: 0.7s;
    }

    .radar-blip:nth-child(5) {
      top: 38%;
      left: 35%;
      width: 3px;
      height: 3px;
      animation-delay: 1.4s;
    }

    @keyframes blipPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
