<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeDrive.je — Minimalist Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--jg:#00A86B;--ab:#0A1A3F;--sy:#FFD60A;--rr:#E63946;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#060b18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:var(--jg)}
.sub{color:#8b9abe;font-size:13px;margin-bottom:18px}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.tbtn{padding:8px 16px;border-radius:8px;border:1px solid #2a3a60;background:#111c36;color:#cbd6ee;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tbtn.active{background:var(--jg);color:#fff;border-color:var(--jg)}
.frame-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame-cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7c9e;font-weight:700;margin-bottom:8px;text-align:center}

/* device */
.device{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);background:#000}
.ipad{width:760px;height:570px}
.mobile{width:300px;height:600px;border-radius:32px;border:8px solid #151515}

/* scene */
.scene{position:absolute;inset:0;background:linear-gradient(180deg,#7cc4e8 0%,#a8dce8 32%,#cfe6c9 55%,#7fb96a 56%,#4f9046 100%)}
.sun{position:absolute;top:12%;right:16%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd60a 55%,rgba(255,214,10,0));filter:blur(1px)}
.road{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34%;height:52%;background:linear-gradient(180deg,#444,#2a2a2a);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 34px,var(--sy) 34px 52px);clip-path:polygon(49% 0,51% 0,60% 100%,40% 100%);opacity:.75}
.tree{position:absolute;background:#2f6b2f;border-radius:50%;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tree::before{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:5px;height:16px;background:#5a3a1a;border-radius:2px}
.t1{width:38px;height:38px;left:8%;bottom:22%}
.t2{width:44px;height:44px;right:8%;bottom:26%}
.t3{width:28px;height:28px;left:16%;bottom:30%}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none}
.hud *{pointer-events:auto}
.glass{background:rgba(10,26,63,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* top-left stats */
.stats{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:3px;padding:10px 14px}
.stats .score{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:var(--sy);line-height:1}
.stats .label{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600}
.stats .speedbar{width:110px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px;overflow:hidden}
.stats .speedbar i{display:block;height:100%;width:56%;background:linear-gradient(90deg,var(--jg),var(--sy))}

/* hamburger */
.menu-btn{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:.3s}
.menu-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* menu panel */
.panel{position:fixed;top:0;right:0;width:270px;max-width:82vw;height:100%;background:rgba(8,16,36,.95);border-left:1px solid rgba(255,255,255,.12);z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.panel-head b{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#cbd6ee}
.panel-head button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
.p-item{display:flex;align-items:center;gap:13px;padding:14px 18px;cursor:pointer;font-size:14px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.04)}
.p-item:hover{background:rgba(255,255,255,.05)}
.p-item .ico{font-size:20px;width:26px;text-align:center}
.p-item.on{color:var(--jg)}
.p-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--jg);box-shadow:0 0 8px var(--jg)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:49}
.overlay.show{opacity:1;pointer-events:auto}

/* bottom-left controls */
.ctrls{position:absolute;bottom:16px;left:14px;display:flex;flex-direction:column;gap:9px}
.cycle{min-width:54px;height:54px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.cycle .ico{font-size:22px;line-height:1}
.cycle .lbl{font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:600}
.cycle.active{background:rgba(255,214,10,.18);border-color:var(--sy)}

/* bottom-right */
.right{position:absolute;bottom:16px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.radar{width:96px;height:96px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle,#08132e,#040a1c);border:2px solid var(--jg)}
.radar::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(rgba(0,168,107,.08) 0 44deg,transparent 44deg 90deg)}
.radar .sweep{position:absolute;inset:0;background:conic-gradient(transparent 300deg,rgba(0,168,107,.4) 360deg);animation:sw 3s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.radar .me{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--sy);box-shadow:0 0 8px var(--sy)}
.radar .blip{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--rr)}
.brake{width:78px;height:78px;border-radius:50%;background:linear-gradient(145deg,#e63946,#bc2732);border:2px solid rgba(255,255,255,.16);box-shadow:0 6px 20px rgba(230,57,70,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.08em;cursor:pointer}

/* mobile adjustments */
.mobile .stats .score{font-size:18px}
.mobile .radar{width:74px;height:74px}
.mobile .brake{width:62px;height:62px;font-size:9px}
.mobile .cycle{min-width:44px;height:44px}
.mobile .ctrls{left:10px;bottom:12px}
.mobile .right{right:10px;bottom:12px}
.mobile .menu-btn{width:40px;height:40px;top:10px;right:10px}
.mobile .stats{top:10px;left:10px;padding:8px 11px}
</style>
</head>
<body>
<h1>VibeDrive<span>.je</span> — Minimalist Controls</h1>
<div class="sub">5 essentials visible · everything else in the ☰ menu · drag to steer</div>

<div class="toolbar">
  <button class="tbtn active" data-t="ipad">iPad</button>
  <button class="tbtn" data-t="mobile">Mobile</button>
</div>

<div class="frame-row" id="frames"></div>

<script>
const brands = { jg:'#00A86B', ab:'#0A1A3F', sy:'#FFD60A', rr:'#E63946' };

function hudHtml(radarSize){
  return `
  <div class="hud">
    <div class="stats glass">
      <div class="label">Score</div>
      <div class="score">1,250</div>
      <div class="label" style="margin-top:6px">Speed</div>
      <div class="score" style="font-size:18px">45 <span style="font-size:9px;color:rgba(255,255,255,.5)">km/h</span></div>
      <div class="speedbar"><i></i></div>
    </div>

    <div class="menu-btn glass" onclick="toggleMenu(this)"><span></span><span></span><span></span></div>

    <div class="ctrls">
      <div class="cycle glass active"><span class="ico">🚗</span><span class="lbl">Drive</span></div>
      <div class="cycle glass"><span class="ico">📷</span><span class="lbl">Cam</span></div>
    </div>

    <div class="right">
      <div class="radar"><div class="sweep"></div><div class="me"></div><div class="blip" style="top:30%;left:62%"></div><div class="blip" style="top:55%;left:38%"></div></div>
      <div class="brake">BRAKE</div>
    </div>
  </div>`;
}

const menuPanel = `
<div class="overlay" onclick="closeMenu()"></div>
<div class="panel" id="menuPanel">
  <div class="panel-head"><b>Menu</b><button onclick="closeMenu()">✕</button></div>
  <div class="p-item on"><span class="ico">🌙</span> Night mode <span class="dot"></span></div>
  <div class="p-item"><span class="ico">🚌</span> Bus routes</div>
  <div class="p-item"><span class="ico">✈️</span> Airport flights</div>
  <div class="p-item"><span class="ico">📻</span> Radio</div>
  <div class="p-item"><span class="ico">🏆</span> Leaderboard</div>
  <div class="p-item"><span class="ico">⚙️</span> Settings</div>
</div>`;

function sceneHtml(){
  return `
  <div class="scene">
    <div class="sun"></div>
    <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div>
    <div class="road"></div>
  </div>`;
}

function renderFrame(type){
  const cls = type === 'ipad' ? 'ipad' : 'mobile';
  const cap = type === 'ipad' ? 'iPad Landscape · 1024×768' : 'Mobile · 375×812';
  return `<div class="frame-wrap"><div class="frame-cap">${cap}</div>
    <div class="device ${cls}">${sceneHtml()}${hudHtml()}${menuPanel}</div></div>`;
}

let current = 'ipad';
function render(){
  document.getElementById('frames').innerHTML = renderFrame(current);
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active', b.dataset.t===current));
}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.t;render();}));

function toggleMenu(btn){
  btn.classList.toggle('open');
  document.getElementById('menuPanel').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('show');
}
function closeMenu(){
  const btn=document.querySelector('.menu-btn');
  if(btn)btn.classList.remove('open');
  const p=document.getElementById('menuPanel');if(p)p.classList.remove('open');
  const o=document.querySelector('.overlay');if(o)o.classList.remove('show');
}
render();
</script>
</body>
</html>
