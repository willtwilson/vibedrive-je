<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeDrive.je — Feature-Rich Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--jg:#00A86B;--ab:#0A1A3F;--sy:#FFD60A;--rr:#E63946;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#060b18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:var(--jg)}
.sub{color:#8b9abe;font-size:13px;margin-bottom:16px;text-align:center}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tbtn{padding:8px 16px;border-radius:8px;border:1px solid #2a3a60;background:#111c36;color:#cbd6ee;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tbtn.active{background:var(--jg);color:#fff;border-color:var(--jg)}
.frame-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame-cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7c9e;font-weight:700;margin-bottom:8px;text-align:center}

.device{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);background:#000}
.ipad{width:780px;height:585px}
.mobile{width:300px;height:610px;border-radius:32px;border:8px solid #151515}

.scene{position:absolute;inset:0;background:linear-gradient(180deg,#7cc4e8 0%,#a8dce8 32%,#cfe6c9 55%,#7fb96a 56%,#4f9046 100%)}
.sun{position:absolute;top:12%;right:16%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd60a 55%,rgba(255,214,10,0));filter:blur(1px)}
.road{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34%;height:52%;background:linear-gradient(180deg,#444,#2a2a2a);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 34px,var(--sy) 34px 52px);clip-path:polygon(49% 0,51% 0,60% 100%,40% 100%);opacity:.75}
.tree{position:absolute;background:#2f6b2f;border-radius:50%;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tree::before{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:5px;height:16px;background:#5a3a1a;border-radius:2px}
.t1{width:38px;height:38px;left:7%;bottom:22%}
.t2{width:44px;height:44px;right:7%;bottom:26%}
.t3{width:28px;height:28px;left:15%;bottom:32%}

.hud{position:absolute;inset:0;pointer-events:none}
.hud *{pointer-events:auto}
.glass{background:rgba(10,26,63,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:12px}

/* top bar */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,rgba(10,26,63,.85),rgba(10,26,63,0))}
.brand{font-weight:800;font-size:14px;padding:6px 10px;background:rgba(10,26,63,.6);border:1px solid rgba(255,255,255,.12);border-radius:10px;display:flex;align-items:center;gap:6px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--jg);box-shadow:0 0 8px var(--jg)}
.chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:500;background:rgba(10,26,63,.6);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.chip .v{font-family:'JetBrains Mono',monospace;font-weight:600;color:#fff}
.chip.score{background:linear-gradient(135deg,rgba(0,168,107,.8),rgba(0,168,107,.4));border-color:rgba(0,168,107,.6)}
.chip.score .v{color:var(--sy)}
.chip.wanted{border-color:rgba(230,57,70,.5)}
.chip.wanted .v{color:#ffb3b8;letter-spacing:1px}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:20px;background:rgba(10,26,63,.6);border:1px solid rgba(255,255,255,.12)}
.user .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--sy),var(--rr));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ab)}
.user .nm{font-size:11px;font-weight:600}

/* right strip */
.strip{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.stop{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-size:18px}
.stop.on{background:linear-gradient(135deg,var(--jg),#008a57);border-color:var(--jg)}
.stop .lbl{font-size:7px;letter-spacing:.08em;color:rgba(255,255,255,.6);text-transform:uppercase;font-weight:700}

/* radar */
.radar{position:absolute;bottom:110px;left:14px;width:110px;height:110px;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#08132e,#040a1c);border:2px solid var(--jg)}
.radar::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(rgba(0,168,107,.08) 0 44deg,transparent 44deg 90deg)}
.radar .sweep{position:absolute;inset:0;background:conic-gradient(transparent 300deg,rgba(0,168,107,.4) 360deg);animation:sw 3s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.radar .me{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--sy);box-shadow:0 0 8px var(--sy)}

/* bottom bar */
.botbar{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;gap:10px}
.bb-group{display:flex;align-items:center;gap:6px;padding:7px;border-radius:16px}
.mbtn{width:48px;height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.mbtn .ico{font-size:20px;line-height:1}
.mbtn .lbl{font-size:8px;letter-spacing:.06em;color:rgba(255,255,255,.6);font-weight:600}
.mbtn.active{background:linear-gradient(135deg,var(--sy),#eec500);border-color:var(--sy)}
.mbtn.active .ico,.mbtn.active .lbl{color:var(--ab)}
.speedo{display:flex;align-items:baseline;gap:5px;padding:8px 13px}
.speedo .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;color:var(--sy);line-height:1}
.speedo .u{font-size:10px;color:#8b9abe}
.pedals{display:flex;gap:7px;align-items:flex-end}
.brake{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,rgba(230,57,70,.85),rgba(230,57,70,.5));border:1px solid rgba(230,57,70,.6);box-shadow:0 6px 18px rgba(230,57,70,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.hand{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}

/* collapsed */
.collapsed .strip .stop:nth-child(n+3){display:none}
.collapsed .topbar .chip{display:none}
.collapsed .topbar .chip.score{display:flex}
.collapsed .bb-group.cams{opacity:.45}

/* panels */
.panel{position:absolute;top:56px;right:64px;width:300px;max-width:78%;background:rgba(8,16,36,.94);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:0;display:none;z-index:40;overflow:hidden}
.panel.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.p-head{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.p-head button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;width:26px;height:26px;border-radius:8px;cursor:pointer}
.p-body{padding:10px 14px;max-height:300px;overflow-y:auto;font-size:12px}
.lb{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:8px}
.lb .rk{width:20px;font-family:'JetBrains Mono',monospace;color:#8b9abe;font-weight:600}
.lb.me{background:rgba(0,168,107,.18)}
.lb .nm{flex:1;font-weight:500}
.lb .sc{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--sy)}
.lb .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#555,#333);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}

/* mobile */
.mobile .topbar{padding:6px 8px;gap:6px}
.mobile .chip{font-size:9px;padding:4px 7px}
.mobile .chip.hidemob{display:none}
.mobile .user .nm{display:none}
.mobile .strip{right:8px;gap:6px}
.mobile .stop{width:40px;height:40px;font-size:16px}
.mobile .radar{width:80px;height:80px;bottom:140px;left:10px}
.mobile .mbtn{width:42px;height:42px}
.mobile .mbtn .ico{font-size:16px}
.mobile .speedo .n{font-size:19px}
.mobile .brake{width:56px;height:56px;font-size:9px}
.mobile .hand{width:40px;height:40px;font-size:15px}
.mobile .botbar{padding:8px 10px;gap:5px}
</style>
</head>
<body>
<h1>VibeDrive<span>.je</span> — Feature-Rich Controls</h1>
<div class="sub">All controls organised · right-edge toggles · bottom bar · toggle collapsed/expanded</div>

<div class="toolbar">
  <button class="tbtn active" data-t="ipad">iPad</button>
  <button class="tbtn" data-t="mobile">Mobile</button>
  <button class="tbtn" data-t="expanded">Expanded</button>
  <button class="tbtn active" data-t="collapsed">Collapsed</button>
</div>

<div class="frame-row" id="frames"></div>

<script>
function leaderboard(){
  return `<div class="panel" id="lbPanel"><div class="p-head">🏆 Leaderboard <button onclick="closePanel('lbPanel')">✕</button></div>
  <div class="p-body">
    <div class="lb"><span class="rk">1</span><div class="av">MK</div><span class="nm">MountKai</span><span class="sc">8,420</span></div>
    <div class="lb"><span class="rk">2</span><div class="av">SR</div><span class="nm">StSaviourSpeed</span><span class="sc">7,180</span></div>
    <div class="lb"><span class="rk">3</span><div class="av">GH</div><span class="nm">GoreyHornet</span><span class="sc">6,940</span></div>
    <div class="lb me"><span class="rk">14</span><div class="av">JS</div><span class="nm">JerseyRacer (you)</span><span class="sc">1,250</span></div>
    <div class="lb"><span class="rk">15</span><div class="av">QM</div><span class="nm">QuennevaisMapper</span><span class="sc">1,180</span></div>
  </div></div>`;
}
function settings(){
  return `<div class="panel" id="setPanel"><div class="p-head">⚙️ Settings <button onclick="closePanel('setPanel')">✕</button></div>
  <div class="p-body">
    <div style="padding:8px 0;display:flex;justify-content:space-between"><span>Auto-accelerate</span><span style="color:var(--jg);font-weight:700">ON</span></div>
    <div style="padding:8px 0;display:flex;justify-content:space-between"><span>Graphics quality</span><span style="color:var(--sy);font-weight:700">High</span></div>
    <div style="padding:8px 0;display:flex;justify-content:space-between"><span>HUD density</span><span style="color:var(--sy);font-weight:700">Full</span></div>
    <div style="padding:8px 0;display:flex;justify-content:space-between"><span>Music / radio</span><span style="color:var(--jg);font-weight:700">ON</span></div>
  </div></div>`;
}

function frame(type, state){
  const cls = type==='ipad'?'ipad':'mobile';
  const cap = type==='ipad'?'iPad Landscape · 1024×768':'Mobile · 375×812';
  const cstate = state==='collapsed'?'collapsed':'';
  return `
  <div class="frame-wrap">
    <div class="frame-cap">${cap} — ${state}</div>
    <div class="device ${cls} ${cstate}">
      <div class="scene"><div class="sun"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="road"></div></div>
      <div class="hud">
        <div class="topbar">
          <div class="brand"><span class="dot"></span>VibeDrive<span style="color:var(--jg)">.je</span></div>
          <div class="chip score">Score <span class="v">1,250</span></div>
          <div class="chip hidemob">📍 <span class="v">3.4km</span></div>
          <div class="chip hidemob">☀️ <span class="v">Clear 18°</span></div>
          <div class="chip hidemob">🎁 <span class="v">7/12</span></div>
          <div class="chip wanted">⭐ <span class="v">★★☆☆☆</span></div>
          <div class="spacer"></div>
          <div class="chip hidemob">👥 <span class="v">247</span></div>
          <div class="user"><div class="av">JS</div><span class="nm">JerseyRacer</span></div>
        </div>

        <div class="strip">
          <div class="stop glass on">🌙<span class="lbl">Night</span></div>
          <div class="stop glass">🚌<span class="lbl">Bus</span></div>
          <div class="stop glass">✈️<span class="lbl">Flights</span></div>
          <div class="stop glass on">📻<span class="lbl">Radio</span></div>
          <div class="stop glass" onclick="openPanel('lbPanel')">🏆<span class="lbl">Ranks</span></div>
          <div class="stop glass" onclick="openPanel('setPanel')">⚙️<span class="lbl">Setup</span></div>
        </div>

        <div class="radar"><div class="sweep"></div><div class="me"></div></div>

        <div class="botbar">
          <div class="bb-group glass">
            <div class="mbtn active"><span class="ico">🚗</span><span class="lbl">Drive</span></div>
            <div class="mbtn"><span class="ico">🚤</span><span class="lbl">Boat</span></div>
            <div class="mbtn"><span class="ico">✈️</span><span class="lbl">Fly</span></div>
          </div>
          <div class="bb-group glass cams">
            <div class="mbtn"><span class="ico">🎥</span><span class="lbl">Chase</span></div>
            <div class="mbtn"><span class="ico">🔭</span><span class="lbl">Far</span></div>
            <div class="mbtn"><span class="ico">🛰</span><span class="lbl">Top</span></div>
            <div class="mbtn"><span class="ico">🧭</span><span class="lbl">Cockpit</span></div>
          </div>
          <div class="speedo glass"><span class="n">45</span><span class="u">km/h</span></div>
          <div class="pedals">
            <div class="brake">BRAKE</div>
            <div class="hand glass">🅿️</div>
          </div>
        </div>

        ${leaderboard()}
        ${settings()}
      </div>
    </div>
  </div>`;
}

let type='ipad', state='collapsed';
function render(){
  document.getElementById('frames').innerHTML = frame(type, state);
  document.querySelectorAll('.tbtn').forEach(b=>{
    if(b.dataset.t==='ipad'||b.dataset.t==='mobile'){b.classList.toggle('active', b.dataset.t===type);}
    else{b.classList.toggle('active', b.dataset.t===state);}
  });
}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.t;
  if(v==='ipad'||v==='mobile'){type=v;}else{state=v;}
  render();
}));
function openPanel(id){document.getElementById(id).classList.add('open');}
function closePanel(id){document.getElementById(id).classList.remove('open');}
render();
</script>
</body>
</html>
