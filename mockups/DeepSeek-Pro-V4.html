<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeDrive.je — Gesture-First Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--jg:#00A86B;--ab:#0A1A3F;--sy:#FFD60A;--rr:#E63946;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#060b18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:var(--jg)}
.sub{color:#8b9abe;font-size:13px;margin-bottom:16px;text-align:center;max-width:640px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tbtn{padding:8px 16px;border-radius:8px;border:1px solid #2a3a60;background:#111c36;color:#cbd6ee;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tbtn.active{background:var(--jg);color:#fff;border-color:var(--jg)}
.frame-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame-cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7c9e;font-weight:700;margin-bottom:8px;text-align:center}

.device{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);background:#000}
.ipad{width:780px;height:585px}
.mobile{width:300px;height:610px;border-radius:32px;border:8px solid #151515}

.scene{position:absolute;inset:0;background:linear-gradient(180deg,#7cc4e8 0%,#a8dce8 32%,#cfe6c9 55%,#7fb96a 56%,#4f9046 100%)}
.sun{position:absolute;top:12%;right:16%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fff8d8,#ffd60a 55%,rgba(255,214,10,0));filter:blur(1px)}
.road{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34%;height:52%;background:linear-gradient(180deg,#444,#2a2a2a);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 34px,var(--sy) 34px 52px);clip-path:polygon(49% 0,51% 0,60% 100%,40% 100%);opacity:.75}

.hud{position:absolute;inset:0;pointer-events:none}
.hud *{pointer-events:auto}
.glass{background:rgba(10,26,63,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:14px}

/* only-visible-when-needed minimal UI */
.stat{position:absolute;top:14px;left:14px;padding:8px 12px;font-family:'JetBrains Mono',monospace}
.stat .s{font-size:22px;color:var(--sy);font-weight:600}
.stat .l{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600}

/* gesture helper — bottom center pill */
.gesture{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;text-align:center;font-size:12px;line-height:1.5;background:rgba(10,26,63,.7)}
.gesture b{color:var(--sy)}
.gesture .row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px}

/* minimal brake — small ring, appears on touch */
.brake{position:absolute;bottom:20px;right:18px;width:60px;height:60px;border-radius:50%;border:2px solid rgba(230,57,70,.7);background:rgba(230,57,70,.18);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.06em;color:#ffd0d3;cursor:pointer}

/* mode pill — tiny corner gesture indicator */
.modepill{position:absolute;bottom:20px;left:18px;display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:13px;font-weight:600}
.modepill .ico{font-size:18px}

/* gesture cheat-sheet panel */
.cheat{position:absolute;top:14px;right:14px;width:170px;max-width:70%;background:rgba(8,16,36,.92);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:13px;font-size:11px;display:none;z-index:30}
.cheat.open{display:block}
.cheat h4{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--jg);margin-bottom:8px}
.cheat .g{display:flex;align-items:center;gap:8px;padding:4px 0;color:#cbd6ee}
.cheat .g .k{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sy);min-width:60px}
.helpbtn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;font-weight:700}

/* mobile */
.mobile .stat .s{font-size:17px}
.mobile .brake{width:50px;height:50px;font-size:9px;right:12px;bottom:15px}
.mobile .modepill{left:12px;bottom:15px;font-size:11px;padding:6px 10px}
.mobile .gesture{font-size:10px;padding:8px 13px}
</style>
</head>
<body>
<h1>VibeDrive<span>.je</span> — Gesture-First Controls</h1>
<div class="sub">Minimal visible UI · everything on gestures: swipe to change mode/camera, pinch to zoom radar, tap-hold to brake</div>

<div class="toolbar">
  <button class="tbtn active" data-t="ipad">iPad</button>
  <button class="tbtn" data-t="mobile">Mobile</button>
</div>

<div class="frame-row" id="frames"></div>

<script>
function frame(type){
  const cls = type==='ipad'?'ipad':'mobile';
  const cap = type==='ipad'?'iPad Landscape · 1024×768':'Mobile · 375×812';
  return `
  <div class="frame-wrap">
    <div class="frame-cap">${cap}</div>
    <div class="device ${cls}">
      <div class="scene"><div class="sun"></div><div class="road"></div></div>
      <div class="hud">
        <div class="stat glass">
          <div class="l">Score</div>
          <div class="s">1,250</div>
          <div class="l" style="margin-top:5px">Speed</div>
          <div class="s" style="font-size:17px">45 <span style="font-size:9px;color:rgba(255,255,255,.5)">km/h</span></div>
        </div>

        <div class="helpbtn glass" onclick="document.getElementById('cheat').classList.toggle('open')">?</div>
        <div class="cheat" id="cheat">
          <h4>Gestures</h4>
          <div class="g"><span class="k">⬅➡ drag</span> Steer</div>
          <div class="g"><span class="k">⬆ swipe</span> Boost</div>
          <div class="g"><span class="k">⟲ swipe ⬆</span> Mode cycle</div>
          <div class="g"><span class="k">⟲ swipe ⬅➡</span> Camera</div>
          <div class="g"><span class="k">🤏 pinch</span> Zoom radar</div>
          <div class="g"><span class="k">✊ hold</span> Brake</div>
          <div class="g"><span class="k">👆 2× tap</span> Night mode</div>
          <div class="g"><span class="k">🤌 long-press</span> Menu</div>
        </div>

        <div class="modepill glass"><span class="ico">🚗</span> Drive · <span style="color:var(--sy)">swipe ⬆ to change</span></div>

        <div class="brake">HOLD</div>

        <div class="gesture glass">
          <b>Drag to steer</b> · <b>Swipe ⬆</b> mode · <b>Swipe ⬅➡</b> camera · <b>Pinch</b> radar
        </div>
      </div>
    </div>
  </div>`;
}
let type='ipad';
function render(){
  document.getElementById('frames').innerHTML = frame(type);
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active', b.dataset.t===type));
}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.t;render();}));
render();
</script>
</body>
</html>
