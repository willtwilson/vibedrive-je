<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>⚡ Vibe Drive Jersey 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, system-ui, sans-serif; overflow: hidden; background: #87CEEB; color: #fff; touch-action: none; overscroll-behavior: none; }
    canvas#game-canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 1; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 50;
      background: rgba(10, 10, 30, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 14px; padding: 12px 16px; min-width: 200px;
      border: 1px solid rgba(100, 130, 255, 0.2); font-size: 13px;
      pointer-events: none;
    }
    #hud h1 { font-size: 15px; margin-bottom: 4px; }
    #hud .weather-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #hud .temp { font-size: 20px; font-weight: 700; }
    #hud .speedo { font-size: 13px; margin-top: 4px; color: #ffdd44; font-family: monospace; }
    #hud .loc { font-size: 11px; color: #888; margin-top: 2px; }
    #hud .players { font-size: 11px; color: #66ff88; margin-top: 2px; }
    #hud .mode-name { font-size: 12px; color: #66aaff; margin-top: 4px; font-weight: 600; }

    #modes { position: fixed; top: 12px; right: 12px; z-index: 50; display: flex; gap: 6px; pointer-events: auto; }
    .mode-btn {
      padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(100,130,255,0.3);
      background: rgba(10,10,30,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: #fff; font-size: 12px; cursor: pointer; user-select: none; -webkit-user-select: none;
      touch-action: none; transition: all 0.2s;
    }
    .mode-btn.active { background: linear-gradient(135deg, #4466ff, #6688ff); border-color: #6688ff; }
    .mode-btn.disabled { opacity: 0.35; }

    #controls {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
      pointer-events: none; display: flex; justify-content: space-between; padding: 0 20px 24px;
    }
    .control-zone { pointer-events: auto; display: flex; align-items: flex-end; gap: 10px; }
    .control-btn {
      width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(100,130,255,0.3);
      background: rgba(10,10,30,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
      transition: transform 0.1s, background 0.1s;
    }
    .control-btn:active, .control-btn.pressed { transform: scale(0.9); }
    .control-btn.accel { background: rgba(34,180,80,0.4); border-color: rgba(34,180,80,0.5); }
    .control-btn.brake { background: rgba(220,50,50,0.4); border-color: rgba(220,50,50,0.5); }

    #badge {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 50;
      background: rgba(10,10,30,0.75); backdrop-filter: blur(8px);
      border-radius: 8px; padding: 4px 12px; font-size: 10px; color: #5577ff; pointer-events: none;
    }

    #radar {
      position: fixed; bottom: 24px; left: 12px; z-index: 50;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(5, 20, 10, 0.8); border: 2px solid rgba(100, 255, 130, 0.4);
      overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 100, 0.15); pointer-events: none;
    }
    #radar canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #radar-label {
      position: fixed; bottom: 208px; left: 12px; z-index: 50;
      font-size: 10px; color: #44ff88; text-shadow: 0 0 4px rgba(0,0,0,0.8); pointer-events: none;
    }

    #cam-btns {
      position: fixed; top: 70px; right: 12px; z-index: 50; display: flex; flex-direction: column; gap: 6px; pointer-events: auto;
    }
    .cam-btn {
      padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(100,130,255,0.3);
      background: rgba(10,10,30,0.6); backdrop-filter: blur(8px); color: #fff; font-size: 11px;
      cursor: pointer; user-select: none; touch-action: none;
    }
    .cam-btn.active { background: rgba(68,102,255,0.4); border-color: rgba(100,130,255,0.6); }

    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 200;
      background: rgba(10,10,30,0.9); padding: 24px 36px; border-radius: 16px;
      border: 1px solid rgba(100,130,255,0.3); text-align: center; font-size: 16px;
    }

    #steer-hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, 120px); z-index: 50;
      background: rgba(10,10,30,0.7); padding: 6px 14px; border-radius: 8px;
      font-size: 11px; color: #8899bb; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    #steer-hint.show { opacity: 1; }

    #score-display {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 50;
      background: rgba(10, 10, 30, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 14px; padding: 8px 18px;
      border: 1px solid rgba(255, 221, 68, 0.3);
      font-size: 16px; font-weight: 700; color: #ffdd44; font-family: monospace;
      pointer-events: none; white-space: nowrap;
      text-shadow: 0 0 8px rgba(255, 221, 68, 0.3);
    }
    #score-display .high-score { font-size: 11px; color: #888; font-weight: 400; margin-top: 2px; text-align: center; }

    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 55;
      background: rgba(10, 10, 30, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 12px; padding: 10px 24px;
      border: 1px solid rgba(255, 221, 68, 0.4);
      font-size: 15px; font-weight: 600; color: #ffdd44;
      pointer-events: none; opacity: 0; transition: opacity 0.4s, transform 0.4s;
      white-space: nowrap; text-shadow: 0 0 8px rgba(255, 221, 68, 0.3);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #ad-popup {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 60; background: rgba(10,10,30,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 12px; padding: 12px 20px; text-align: center;
      border: 1px solid rgba(255,215,0,0.4); pointer-events: none;
      opacity: 0; transition: opacity 0.3s, transform 0.3s; max-width: 320px;
    }
    #ad-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #ad-popup .ad-name { font-size: 16px; font-weight: 700; color: #fff; }
    #ad-popup .ad-tag { font-size: 12px; color: #ccc; margin-top: 2px; }
    #ad-popup .ad-pts { font-size: 14px; color: #ffdd44; font-weight: 700; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="loading">⚡ Loading Jersey 3D…</div>

  <div id="hud">
    <h1>⚡ Vibe Drive Jersey 3D</h1>
    <div class="weather-row">
      <span id="weather-icon">🌤️</span>
      <span class="temp" id="temp">—°</span>
      <span id="weather-desc">Loading…</span>
    </div>
    <div class="speedo" id="speed">Speed: 0 km/h</div>
    <div class="loc" id="loc">Jersey, Channel Islands</div>
    <div class="players" id="players">4 players online</div>
    <div class="mode-name" id="mode-name">🚗 Drive Mode</div>
  </div>

  <div id="modes">
    <button class="mode-btn active" data-mode="drive">🚗 Drive</button>
    <button class="mode-btn" data-mode="boat">🚤 Boat</button>
    <button class="mode-btn" data-mode="fly">✈️ Fly</button>
  </div>

  <div id="cam-btns">
    <button class="cam-btn active" data-cam="chase">Chase</button>
    <button class="cam-btn" data-cam="far">Far</button>
    <button class="cam-btn" data-cam="top">Top</button>
    <button class="cam-btn" data-cam="cockpit">Cockpit</button>
    <button class="cam-btn" id="night-toggle">🌙 Night</button>
  </div>

  <div id="controls">
    <div class="control-zone">
      <div class="control-btn" id="btn-left">◀</div>
      <div class="control-btn" id="btn-right">▶</div>
    </div>
    <div class="control-zone">
      <div class="control-btn brake" id="btn-brake">⬇</div>
      <div class="control-btn accel" id="btn-gas">⬆</div>
    </div>
  </div>

  <div id="radar-label">📡 RADAR</div>
  <div id="radar"><canvas id="radar-canvas" width="180" height="180"></canvas></div>

  <div id="badge">vibe.je hackathon · 3D terrain · real weather</div>
  <div id="steer-hint">👆 Touch and drag anywhere to steer</div>

  <div id="score-display">🏆 Score: 0 | 🛣️ 0.0 km<div class="high-score" id="high-score"></div></div>
  <div id="toast"></div>

  <div id="ad-popup">
    <div class="ad-name" id="ad-name"></div>
    <div class="ad-tag" id="ad-tag"></div>
    <div class="ad-pts">+5 pts</div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.185.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ====== SCENE ======
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 200, 1000);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);
    camera.position.set(0, 50, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.id = 'game-canvas';
    document.body.appendChild(renderer.domElement);

    // ====== LIGHTING ======
    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a5a2a, 0.8);
    scene.add(hemiLight);
    const sunLight = new THREE.DirectionalLight(0xffffee, 1.0);
    sunLight.position.set(100, 200, 100);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.left = -500; sunLight.shadow.camera.right = 500;
    sunLight.shadow.camera.top = 500; sunLight.shadow.camera.bottom = -500;
    sunLight.shadow.camera.far = 800;
    scene.add(sunLight);

    // --- Time-based sky & sun arc ---
    function getTimeOfDay() {
      const h = new Date().getHours();
      if (h >= 6 && h < 8) return 'dawn';
      if (h >= 8 && h < 17) return 'day';
      if (h >= 17 && h < 20) return 'dusk';
      return 'night';
    }
    const skyColors = { dawn: 0xff8844, day: 0x87CEEB, dusk: 0xff6644, night: 0x0a0a1e };
    // --- Sky color transition (lerp over 1 second) ---
    let targetSkyColor = new THREE.Color(skyColors.day);
    let skyTransitionFrom = new THREE.Color(skyColors.day);
    let skyTransitionStart = 0;
    let skyTransitionActive = false;
    const SKY_TRANSITION_MS = 1000;
    function applySkyAndSun() {
      const tod = forceNight ? 'night' : getTimeOfDay();
      const skyHex = skyColors[tod];
      // Start sky color transition (lerp over 1 second)
      skyTransitionFrom.copy(scene.background);
      targetSkyColor.setHex(skyHex);
      skyTransitionStart = performance.now();
      skyTransitionActive = true;
      scene.fog = new THREE.Fog(skyHex, tod === 'night' ? 100 : 200, tod === 'night' ? 500 : 1000);
      // Sun arc: angle based on hour (6am=0° east, 6pm=180° west, 12pm=90° overhead)
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      const sunAngle = ((h - 6) / 12) * Math.PI; // 0 at 6am, PI at 6pm
      const sunRadius = 300;
      const sunX = Math.cos(sunAngle) * sunRadius;
      const sunY = Math.sin(sunAngle) * sunRadius;
      sunLight.position.set(sunX, Math.max(sunY, 50), 100);
      const isNight = tod === 'night';
      if (isNight) {
        sunLight.intensity = 0.15;
        sunLight.color.setHex(0x4466aa);
        hemiLight.intensity = 0.25;
        hemiLight.color.setHex(0x1a1a3e);
        hemiLight.groundColor.setHex(0x1a2a1a);
        if (moonMesh) moonMesh.visible = true;
        buildingMat.emissive.setHex(0x332211); buildingMat.emissiveIntensity = 0.3;
        buildingMat2.emissive.setHex(0x332211); buildingMat2.emissiveIntensity = 0.3;
        roofMat.emissive.setHex(0x221100); roofMat.emissiveIntensity = 0.2;
      } else if (tod === 'dawn' || tod === 'dusk') {
        sunLight.intensity = 0.7;
        sunLight.color.setHex(0xff8844);
        hemiLight.intensity = 0.5;
        hemiLight.color.setHex(0xff8844);
        hemiLight.groundColor.setHex(0x3a5a2a);
        if (moonMesh) moonMesh.visible = false;
        buildingMat.emissive.setHex(0x000000); buildingMat2.emissive.setHex(0x000000);
        roofMat.emissive.setHex(0x000000);
      } else {
        sunLight.intensity = 1.0;
        sunLight.color.setHex(0xffffee);
        hemiLight.intensity = 0.8;
        hemiLight.color.setHex(0x87CEEB);
        hemiLight.groundColor.setHex(0x3a5a2a);
        if (moonMesh) moonMesh.visible = false;
        buildingMat.emissive.setHex(0x000000); buildingMat2.emissive.setHex(0x000000);
        roofMat.emissive.setHex(0x000000);
      }
      // Toggle headlights (intensity 3.0 at night) and taillight glow (0.8 at night)
      if (carGroup && carGroup.userData && carGroup.userData.headlights) {
        carGroup.userData.headlights.forEach(hl => { hl.intensity = isNight ? 3.0 : 0; });
      }
      if (carGroup && carGroup.userData && carGroup.userData.taillights) {
        carGroup.userData.taillights.forEach(tl => { tl.material.emissiveIntensity = isNight ? 0.8 : 0.3; });
      }
    }

    // --- Moon (visible at night) ---
    const moonGeo = new THREE.SphereGeometry(15, 16, 16);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xeeeecc, emissive: 0xddddee, emissiveIntensity: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.set(200, 150, 0);
    moonMesh.visible = false;
    scene.add(moonMesh);

    // --- Clouds (6 flat white planes drifting in +x, wrap around) ---
    const clouds = [];
    const cloudGeo = new THREE.PlaneGeometry(40, 20);
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, roughness: 1.0, side: THREE.DoubleSide });
    for (let i = 0; i < 6; i++) {
      const cloud = new THREE.Mesh(cloudGeo, cloudMat);
      cloud.position.set(
        -300 + Math.random() * 600,
        80 + Math.random() * 40,
        -200 + Math.random() * 400
      );
      cloud.rotation.x = -Math.PI / 2; // flat horizontal
      cloud.rotation.z = Math.random() * Math.PI;
      cloud.userData = { speed: 0.5 + Math.random() * 1.0 };
      clouds.push(cloud);
      scene.add(cloud);
    }

    // ====== TERRAIN ======
    const ISLAND_SIZE = 400, TERRAIN_SEGMENTS = 128, MAX_HEIGHT = 35;
    function noise2D(x, y, seed) { const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453; return n - Math.floor(n); }
    function smoothNoise(x, y, seed) {
      const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      const a = noise2D(ix, iy, seed), b = noise2D(ix+1, iy, seed), c = noise2D(ix, iy+1, seed), d = noise2D(ix+1, iy+1, seed);
      const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
      return a*(1-ux)*(1-uy) + b*ux*(1-uy) + c*(1-ux)*uy + d*ux*uy;
    }
    function fbm(x, y, seed) {
      let val = 0, amp = 1, freq = 1, max = 0;
      for (let i = 0; i < 4; i++) { val += smoothNoise(x*freq, y*freq, seed+i*1000) * amp; max += amp; amp *= 0.5; freq *= 2; }
      return val / max;
    }
    function islandMask(x, z) {
      const cx = 0, cz = -50;
      const dx = (x - cx) / (ISLAND_SIZE * 0.45), dz = (z - cz) / (ISLAND_SIZE * 0.55);
      const dist = Math.sqrt(dx*dx + dz*dz);
      const angle = Math.atan2(z - cz, x - cx);
      const coastVariation = 0.15 * Math.sin(angle * 3) + 0.1 * Math.cos(angle * 5);
      return Math.max(0, 1.0 - dist + coastVariation);
    }
    function getTerrainHeight(x, z) {
      const mask = islandMask(x, z);
      if (mask <= 0) return -5;
      const noise = fbm(x * 0.01, z * 0.01, 42);
      const noise2 = fbm(x * 0.03, z * 0.03, 137) * 0.3;
      const northFactor = z < -100 ? 1.3 : 1.0;
      return mask * (noise + noise2) * MAX_HEIGHT * northFactor;
    }

    const terrainGeo = new THREE.PlaneGeometry(ISLAND_SIZE * 1.5, ISLAND_SIZE * 2, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS * 1.5);
    terrainGeo.rotateX(-Math.PI / 2);
    const positions = terrainGeo.attributes.position;
    const colors = [];
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i), z = positions.getZ(i);
      const h = getTerrainHeight(x, z);
      positions.setY(i, h);
      if (h < 0.5) colors.push(0.9, 0.85, 0.65);
      else if (h < 5) colors.push(0.35 + Math.random()*0.1, 0.55 + Math.random()*0.15, 0.25);
      else if (h < 15) colors.push(0.25, 0.45 + Math.random()*0.1, 0.18);
      else if (h < 25) colors.push(0.35, 0.38, 0.2);
      else colors.push(0.45, 0.42, 0.38);
    }
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.0 }));
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ====== WATER ======
    const waterGeo = new THREE.PlaneGeometry(3000, 3000);
    waterGeo.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color: 0x1a4a7a, transparent: true, opacity: 0.55, roughness: 0.3, metalness: 0.6 }));
    water.position.y = -3;
    scene.add(water);

    // ====== TREES ======
    const treeGroup = new THREE.Group();
    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, 1.5, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.9 });
    const leafGeo = new THREE.ConeGeometry(1.2, 3, 7);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6e2d, roughness: 0.8 });
    const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x3a8a3a, roughness: 0.8 });
    for (let i = 0; i < 150; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * ISLAND_SIZE * 0.4;
      const x = Math.cos(angle) * r, z = -50 + Math.sin(angle) * r;
      const h = getTerrainHeight(x, z);
      if (h < 1 || h > 28) continue;
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 0.75; trunk.castShadow = true; tree.add(trunk);
      const leaves = new THREE.Mesh(leafGeo, Math.random() > 0.5 ? leafMat : leafMat2); leaves.position.y = 2.5; leaves.castShadow = true; tree.add(leaves);
      const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 6), leaves.material); leaves2.position.y = 3.5; leaves2.castShadow = true; tree.add(leaves2);
      const scale = 0.6 + Math.random() * 0.6; tree.scale.set(scale, scale, scale);
      tree.position.set(x, h, z); tree.rotation.y = Math.random() * Math.PI;
      treeGroup.add(tree);
    }
    scene.add(treeGroup);

    // ====== BUILDINGS ======
    const buildingGroup = new THREE.Group();
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.7 });
    const buildingMat2 = new THREE.MeshStandardMaterial({ color: 0xaaaa99, roughness: 0.7 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x884422, roughness: 0.8 });
    const buildingLocations = [
      [5,55,3,3],[-8,58,4,2.5],[12,62,5,3],[-15,50,3,4],[20,45,4,3],[-25,60,6,3],[8,70,4,2.5],[-5,72,3,3],
      [30,55,5,4],[-35,65,4,3],[15,75,3,2.5],[-20,78,5,3],[40,60,6,4],[-42,52,4,3],[25,80,3,2.5],[-30,85,5,3],
      [-100,20,4,3],[-110,15,3,2.5],[-95,25,5,3],[90,-20,4,3],[100,-15,3,2.5],
      [50,-50,3,4],[-60,-80,4,3],[70,10,3,3],[-70,100,3,4],
    ];
    buildingLocations.forEach(([x, z, w, d]) => {
      const h = getTerrainHeight(x, z); if (h < 1) return;
      const height = 2 + Math.random() * 6;
      const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, height, d), Math.random() > 0.5 ? buildingMat : buildingMat2);
      bldg.position.set(x, h + height/2, z); bldg.castShadow = true; bldg.receiveShadow = true; buildingGroup.add(bldg);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.3, d + 0.2), roofMat);
      roof.position.set(x, h + height + 0.15, z); roof.castShadow = true; buildingGroup.add(roof);
    });
    scene.add(buildingGroup);

    // Apply time-based sky and sun (must be after building materials are defined)
    applySkyAndSun();
    setInterval(applySkyAndSun, 60000); // re-check every minute

    // ====== REWARDS SYSTEM ======
    let score = 0;
    let totalDistance = 0; // in game units (meters)
    let highScore = parseInt(localStorage.getItem('vibeDriveHighScore') || '0', 10);
    const landmarks = [
      { name: '🏰 Mont Orgueil Castle', x: 95, z: -25, awarded: false },

    function createCar(color) {

      body.position.y = 0.6; body.castShadow = true; car.add(body);

      const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
      [[-1.1,0.4,1.5],[1.1,0.4,1.5],[-1.1,0.4,-1.5],[1.1,0.4,-1.5]].forEach(p => {
        const w = new THREE.Mesh(wGeo, wMat); w.position.set(...p); w.rotation.z = Math.PI/2; w.castShadow = true; car.add(w);
      });
      const lGeo = new THREE.SphereGeometry(0.15, 8, 8);
      const lMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffaa, emissiveIntensity: 0.5 });
      [[-0.7,0.5,2.25],[0.7,0.5,2.25]].forEach(p => { const l = new THREE.Mesh(lGeo, lMat); l.position.set(...p); car.add(l); });
      const tMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff0000, emissiveIntensity: 0.3 });
      const taillightMeshes = [];
      [[-0.7,0.6,-2.25],[0.7,0.6,-2.25]].forEach(p => { const l = new THREE.Mesh(lGeo, tMat.clone()); l.position.set(...p); car.add(l); taillightMeshes.push(l); });
      // Headlight spotlights — cast a visible cone of light on the terrain ahead
      const headlight1 = new THREE.SpotLight(0xffffcc, 0, 50, Math.PI/5, 0.4, 1.5);
      headlight1.position.set(-0.7, 0.8, 2.25);
      headlight1.target.position.set(-1.5, 0, 20);
      headlight1.castShadow = false; // shadows from spotlights are expensive; cone is visible via terrain lighting
      car.add(headlight1); car.add(headlight1.target);
      const headlight2 = new THREE.SpotLight(0xffffcc, 0, 50, Math.PI/5, 0.4, 1.5);
      headlight2.position.set(0.7, 0.8, 2.25);
      headlight2.target.position.set(1.5, 0, 20);
      headlight2.castShadow = false;
      car.add(headlight2); car.add(headlight2.target);
      car.userData.headlights = [headlight1, headlight2];
      car.userData.taillights = taillightMeshes;
      return car;
    }

    // ====== AIRPLANE FACTORY ======
    function createPlane(color) {

      // Wings

      wing.position.set(0, 0.3, 0); wing.castShadow = true; plane.add(wing);

      tail.position.set(-1.8, 0.3, 0); tail.castShadow = true; plane.add(tail);
      // Tail fin
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1, 0.1), new THREE.MeshStandardMaterial({ color, roughness: 0.4 }));
      fin.position.set(-1.8, 0.7, 0); fin.castShadow = true; plane.add(fin);
      // Propeller
      const prop = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.8, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 }));

      // Cockpit
      const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x4488cc, transparent: true, opacity: 0.6, roughness: 0.1 }));
      cockpit.position.set(0.3, 0.4, 0); cockpit.scale.set(1, 0.8, 1.2); plane.add(cockpit);
      return plane;
    }

    // ====== BOAT FACTORY ======
    function createBoat(color) {
      const boat = new THREE.Group();
      // Hull: BoxGeometry(4,1.5,10) — bigger for visibility from above
      const hullMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.3 });
      const hull = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 10), hullMat);
      hull.position.y = 0; hull.castShadow = true; boat.add(hull);
      // Bright orange stripe on hull sides — highly visible from above
      const stripeMat = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.3, metalness: 0.3, emissive: 0x441100, emissiveIntensity: 0.3 });
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(4.04, 0.4, 10), stripeMat);
      stripe.position.y = -0.3; boat.add(stripe);
      // Cabin: BoxGeometry(2.5,1,4) on top
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 4), new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.4 }));
      cabin.position.set(0, 1.25, -0.5); cabin.castShadow = true; boat.add(cabin);
      // Mast: CylinderGeometry(0.12,0.12,5) vertical
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5, 8), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.6 }));
      mast.position.set(0, 3, 0); mast.castShadow = true; boat.add(mast);
      // Sail: PlaneGeometry(2.5,4) white triangle
      const sailGeo = new THREE.PlaneGeometry(2.5, 4);
      const sailMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.7 });
      const sail = new THREE.Mesh(sailGeo, sailMat);
      sail.position.set(1.2, 3, 0); sail.castShadow = true; boat.add(sail);
      // Triangle shape via vertex manipulation — make it a triangular sail
      const sailPos = sail.geometry.attributes.position;
      sailPos.setZ(2, 0); sailPos.setZ(3, 0); // narrow bottom to point
      sailPos.setX(2, 0); sailPos.setX(3, 0);
      sail.geometry.computeVertexNormals();
      return boat;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ') { keys.handbrake = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;

      if (e.key === ' ') keys.handbrake = false;

    // Touch buttons — bind to ALL events for max compatibility
    function bindCtrl(id, key) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const press = (e) => { e.preventDefault(); e.stopPropagation(); keys[key] = true; btn.classList.add('pressed'); };
      const release = (e) => { e.preventDefault(); e.stopPropagation(); keys[key] = false; btn.classList.remove('pressed'); };
      btn.addEventListener('pointerdown', press, { passive: false });
      btn.addEventListener('pointerup', release, { passive: false });
      btn.addEventListener('pointercancel', release, { passive: false });
      btn.addEventListener('pointerleave', release, { passive: false });
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    }
    bindCtrl('btn-gas', 'up'); bindCtrl('btn-brake', 'down'); bindCtrl('btn-left', 'left'); bindCtrl('btn-right', 'right');

    // Pointer steering — touch ANYWHERE to steer (attached to document, not canvas, to avoid z-index issues)
    let pointerSteering = false, pointerStartX = 0, pointerStartY = 0;
    const hudEl = document.getElementById('hud');
    const modesEl = document.getElementById('modes');
    const controlsEl = document.getElementById('controls');
    const camBtnsEl = document.getElementById('cam-btns');
    const radarEl = document.getElementById('radar');

    function isOnUI(target) {
      if (!target) return false;
      return target.closest('#hud') || target.closest('#modes') || target.closest('#controls') ||
             target.closest('#cam-btns') || target.closest('#radar') || target.closest('#radar-label') ||
             target.closest('#badge') || target.closest('#steer-hint') || target.closest('#loading') ||
             target.closest('#ad-popup') || target.closest('#score-display') || target.closest('#toast') ||
             target.closest('#night-toggle');
    }

    document.addEventListener('pointerdown', (e) => {
      if (isOnUI(e.target)) return;
      pointerSteering = true;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      document.getElementById('steer-hint').classList.remove('show');
    }, { passive: false });

    document.addEventListener('pointermove', (e) => {
      if (!pointerSteering) return;
      const deltaX = (e.clientX - pointerStartX) / 100;
      steerValue = Math.max(-2.5, Math.min(2.5, deltaX * 1.5));
    }, { passive: false });

    document.addEventListener('pointerup', () => { pointerSteering = false; steerValue = 0; });
    document.addEventListener('pointercancel', () => { pointerSteering = false; steerValue = 0; });

    setTimeout(() => document.getElementById('steer-hint').classList.add('show'), 2000);
    setTimeout(() => document.getElementById('steer-hint').classList.remove('show'), 8000);

    // Prevent iOS scroll/zoom
    document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', (e) => { e.preventDefault(); });

    // Mode switching
    document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const mode = btn.dataset.mode;
        if (btn.classList.contains('disabled')) return;
        // Switch vehicle
        if (mode === 'fly') {
          vehicleMode = 'fly';
          // Replace car with plane — use plane mesh directly
          scene.remove(carGroup);
          if (wakeTrailLine) { scene.remove(wakeTrailLine); wakeTrailLine = null; }
          carGroup = createPlane(0xcc2222);
          const terrainH = getTerrainHeight(carX, carZ);
          carGroup.position.set(carX, terrainH + 5, carZ);
          scene.add(carGroup);
          // Smooth takeoff: start at terrain+5, rise to 50 over 2 seconds
          planeAlt = terrainH + 5;
          planeTakeoffTarget = 50;
          planeTakeoffStart = planeAlt;
          planeTakeoffT = 0;
          carSpeed = 50; // Cessna — start moving immediately!
          camMode = 'chase'; // ensure chase view behind the plane
          document.querySelectorAll('.cam-btn[data-cam]').forEach(b => b.classList.toggle('active', b.dataset.cam === 'chase'));
          // Add shadow plane (flat dark circle on ground)
          if (!planeShadow) {
            const shadowGeo = new THREE.CircleGeometry(3, 16);
            const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false });
            planeShadow = new THREE.Mesh(shadowGeo, shadowMat);
            planeShadow.rotation.x = -Math.PI / 2;
            scene.add(planeShadow);
          }
          planeShadow.visible = true;
          document.getElementById('mode-name').textContent = '✈️ Fly Mode';
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        } else if (mode === 'boat') {
          vehicleMode = 'boat';
          // Replace car with boat — use boat mesh directly, not copy
          scene.remove(carGroup);
          carGroup = createBoat(0xcc2222);
          // Start boat at nearest water point
          const startH = getTerrainHeight(carX, carZ);
          if (startH > tideLevel) {
            // We're on land — move to nearby water
            carX = 0; carZ = 80; // St Helier bay area
          }
          carGroup.position.set(carX, tideLevel + 1, carZ);
          scene.add(carGroup);
          // Initialize wake trail line
          if (wakeTrailLine) scene.remove(wakeTrailLine);
          wakeTrailPoints = [];
          const wakeTrailGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(carX, tideLevel + 0.2, carZ)]);
          const wakeTrailMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, linewidth: 2 });
          wakeTrailLine = new THREE.Line(wakeTrailGeo, wakeTrailMat);
          scene.add(wakeTrailLine);
          document.getElementById('mode-name').textContent = '🚤 Boat Mode';
          if (planeShadow) planeShadow.visible = false;
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        } else if (mode === 'drive') {
          vehicleMode = 'drive';
          planeAlt = 0;
          // Restore original car — create fresh car mesh
          scene.remove(carGroup);
          if (wakeTrailLine) { scene.remove(wakeTrailLine); wakeTrailLine = null; }
          carGroup = createCar(0xcc2222);
          const th = getTerrainHeight(carX, carZ);
          carGroup.position.set(carX, Math.max(th + 0.5, 0), carZ);
          scene.add(carGroup);
          document.getElementById('mode-name').textContent = '🚗 Drive Mode';
          if (planeShadow) planeShadow.visible = false;
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
      });
    });

    // Camera modes
    let camMode = 'chase';
    document.querySelectorAll('.cam-btn[data-cam]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        camMode = btn.dataset.cam;
        document.querySelectorAll('.cam-btn[data-cam]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ====== DAY/NIGHT TOGGLE ======
    let forceNight = false;
    const nightToggle = document.getElementById('night-toggle');
    nightToggle.addEventListener('click', (e) => {
      e.preventDefault();
      forceNight = !forceNight;
      nightToggle.textContent = forceNight ? '☀️ Day' : '🌙 Night';
      nightToggle.classList.toggle('active', forceNight);
      applySkyAndSun();
    });

    // ====== RADAR (zoomed out to show whole island) ======
    const radarCanvas = document.getElementById('radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');
    const RADAR_SIZE = 180, RADAR_RANGE = 350; // wider range to show whole island

    // Sample coastline from islandMask() — trace boundary by ray-casting from island center
    const coastlinePoints = (() => {
      const points = [];
      const icx = 0, icz = -50;
      const numRays = 120;
      const maxRadius = 300;
      const stepSize = 2;
      for (let i = 0; i < numRays; i++) {
        const angle = (i / numRays) * Math.PI * 2;
        const dirX = Math.cos(angle), dirZ = Math.sin(angle);
        let lastInside = true;
        let bx = icx, bz = icz;
        for (let r = 0; r <= maxRadius; r += stepSize) {
          const x = icx + dirX * r, z = icz + dirZ * r;
          const mask = islandMask(x, z);
          if (mask <= 0 && lastInside) {
            // Binary-search refine the boundary
            let lo = r - stepSize, hi = r;
            for (let j = 0; j < 10; j++) {
              const mid = (lo + hi) / 2;
              if (islandMask(icx + dirX * mid, icz + dirZ * mid) > 0) lo = mid;
              else hi = mid;
            }
            bx = icx + dirX * (lo + hi) / 2;
            bz = icz + dirZ * (lo + hi) / 2;
            break;
          }
          lastInside = mask > 0;
        }
        points.push({ x: bx, z: bz });
      }
      return points;
    })();

    function drawRadar() {
      radarCtx.clearRect(0, 0, RADAR_SIZE, RADAR_SIZE);
      const cx = RADAR_SIZE / 2, cy = RADAR_SIZE / 2;
      const scale = (RADAR_SIZE / 2) / RADAR_RANGE;

      // Background
      radarCtx.fillStyle = 'rgba(0, 20, 5, 0.6)';
      radarCtx.beginPath(); radarCtx.arc(cx, cy, RADAR_SIZE/2 - 2, 0, Math.PI * 2); radarCtx.fill();

      // Grid lines
      radarCtx.strokeStyle = 'rgba(0, 255, 80, 0.15)';
      radarCtx.lineWidth = 1;
      radarCtx.beginPath();
      radarCtx.moveTo(cx, 2); radarCtx.lineTo(cx, RADAR_SIZE-2);
      radarCtx.moveTo(2, cy); radarCtx.lineTo(RADAR_SIZE-2, cy);
      radarCtx.stroke();

      // Island outline — coastline sampled from islandMask()
      radarCtx.save();
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, RADAR_SIZE/2 - 2, 0, Math.PI * 2);
      radarCtx.clip();
      radarCtx.strokeStyle = 'rgba(0, 255, 80, 0.5)';
      radarCtx.fillStyle = 'rgba(0, 80, 20, 0.35)';
      radarCtx.lineWidth = 2;
      radarCtx.beginPath();
      coastlinePoints.forEach((pt, i) => {
        const px = cx + (pt.x - carX) * scale;
        const py = cy + (pt.z - carZ) * scale;
        if (i === 0) radarCtx.moveTo(px, py);
        else radarCtx.lineTo(px, py);
      });
      radarCtx.closePath();
      radarCtx.fill();
      radarCtx.stroke();
      radarCtx.restore();

      // AI cars
      aiCars.forEach(ai => {
        const dx = (ai.x - carX) * scale;
        const dz = (ai.z - carZ) * scale;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < RADAR_SIZE/2) {
          radarCtx.fillStyle = '#ffaa00';
          radarCtx.beginPath();
          radarCtx.arc(cx + dx, cy + dz, 3, 0, Math.PI * 2);
          radarCtx.fill();
          // Name label
          radarCtx.fillStyle = 'rgba(255,170,0,0.6)';
          radarCtx.font = '7px monospace';
          radarCtx.fillText(ai.name.substring(0, 5), cx + dx + 4, cy + dz + 2);
        }
      });

      // Player (center, with heading arrow)
      radarCtx.fillStyle = '#44ff88';
      radarCtx.beginPath();
      radarCtx.moveTo(cx, cy - 6);
      radarCtx.lineTo(cx - 4, cy + 4);
      radarCtx.lineTo(cx + 4, cy + 4);
      radarCtx.closePath();
      radarCtx.fill();

      // Billboards on radar
      if (typeof billboards !== 'undefined') {
        billboards.forEach(bb => {
          const dx = (bb.x - carX) * scale;
          const dz = (bb.z - carZ) * scale;
          const dist = Math.sqrt(dx*dx + dz*dz);
          if (dist < RADAR_SIZE/2) {
            radarCtx.fillStyle = bb.isPrimary ? '#ffd700' : '#ff66ff';
            radarCtx.beginPath();
            radarCtx.arc(cx + dx, cy + dz, bb.isPrimary ? 4 : 2.5, 0, Math.PI * 2);
            radarCtx.fill();
          }
        });
      }

      // Sweep line
      const sweepAngle = (performance.now() / 1000) % (Math.PI * 2);
      radarCtx.strokeStyle = 'rgba(0, 255, 80, 0.25)';
      radarCtx.lineWidth = 1;
      radarCtx.beginPath();
      radarCtx.moveTo(cx, cy);
      radarCtx.lineTo(cx + Math.cos(sweepAngle) * RADAR_SIZE/2, cy + Math.sin(sweepAngle) * RADAR_SIZE/2);
      radarCtx.stroke();

      // N label
      radarCtx.fillStyle = 'rgba(0,255,80,0.5)';
      radarCtx.font = '8px monospace';
      radarCtx.fillText('N', cx - 3, 10);
    }

    // ====== GAME LOOP ======
    let lastTime = performance.now();

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // ====== SKY COLOR TRANSITION (lerp over 1 second) ======
      if (skyTransitionActive) {
        const elapsed = now - skyTransitionStart;
        const t = Math.min(elapsed / SKY_TRANSITION_MS, 1);
        scene.background.lerpColors(skyTransitionFrom, targetSkyColor, t);
        if (t >= 1) skyTransitionActive = false;
      }

      // ====== TIDE ANIMATION ======
      const tideLevel = -3 + Math.sin(now * 0.0005) * 2; // oscillates between -5 and -1
      water.position.y = tideLevel;

      // ====== VEHICLE PHYSICS ======
      // Boat physics: ACCEL/2, wider turning (TURN_RATE*0.6), more momentum (FRICTION/2)
      const accel = vehicleMode === 'boat' ? ACCEL / 2 : ACCEL;
      const friction = vehicleMode === 'boat' ? FRICTION / 2 : FRICTION;
      const turnRate = vehicleMode === 'boat' ? TURN_RATE * 0.6 : TURN_RATE;
      // Vehicle physics — improved with exponential accel, proportional brake, speed-sensitive turning
      if (keys.up) {
        // (1) Exponential acceleration ramp — slows as approaching MAX_SPEED
        carSpeed += accel * dt * (1 - carSpeed / MAX_SPEED);
      } else if (keys.down) {
        if (carSpeed > 0) {
          // (2) Braking proportional to speed
          const brakeForce = BRAKE * dt * (Math.abs(carSpeed) / MAX_SPEED + 0.3);
          carSpeed -= brakeForce;
        } else {
          // (7) Reverse — accelerate backwards at half rate
          carSpeed -= accel * dt * 0.5 * (1 - Math.abs(carSpeed) / 20);
        }
      } else {
        // Natural friction / engine braking — handbrake reduces friction for more slide
        const frictionRate = keys.handbrake ? 2 : friction;
        if (carSpeed > 0) carSpeed -= frictionRate * dt;
        else if (carSpeed < 0) carSpeed += frictionRate * dt;
      }
      carSpeed = Math.max(-20, Math.min(MAX_SPEED, carSpeed));
      if (Math.abs(carSpeed) < 0.3) carSpeed = 0;

      // (3) Turning — turn rate inversely proportional to speed
      if (Math.abs(carSpeed) > 1) {
        const turnFactor = turnRate * dt * (1 - Math.abs(carSpeed) / MAX_SPEED * 0.5);
        const dir = carSpeed > 0 ? 1 : -1; // reverse steering when going backwards
        if (keys.left) carHeading += turnFactor * 3 * dir;
        if (keys.right) carHeading -= turnFactor * 3 * dir;
        if (Math.abs(steerValue) > 0.05) carHeading -= steerValue * turnFactor * 5 * dir;

        // (4) Lateral momentum — on sharp turns, car slides slightly
        const turnInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0) - steerValue;
        const slideFactor = keys.handbrake ? 3.0 : 1.0; // handbrake increases slide
        lateralVelocity += turnInput * Math.abs(carSpeed) / MAX_SPEED * dt * 8 * slideFactor;
      }
      // Decay lateral velocity over time
      const lateralDecay = keys.handbrake ? 0.90 : 0.92; // handbrake = slower decay = more slide
      lateralVelocity *= lateralDecay;
      if (Math.abs(lateralVelocity) < 0.01) lateralVelocity = 0;

      // (5) Terrain slope — sample height at car position and 1 unit ahead
      const rad = carHeading * Math.PI / 180;
      const aheadX = carX + Math.sin(rad) * 1;
      const aheadZ = carZ + Math.cos(rad) * 1;
      const hHere = getTerrainHeight(carX, carZ);
      const hAhead = getTerrainHeight(aheadX, aheadZ);
      if (hAhead > hHere) {
        // Uphill — reduce speed by 5%
        carSpeed *= 1 - 0.05 * dt * 10;
      } else if (hAhead < hHere) {
        // Downhill — increase speed by 3%
        carSpeed *= 1 + 0.03 * dt * 10;
      }

      // Movement — forward + lateral slide
      if (Math.abs(carSpeed) > 0.1 || Math.abs(lateralVelocity) > 0.01) {
        const dist = carSpeed * 0.3 * dt;
        carX += Math.sin(rad) * dist;
        carZ += Math.cos(rad) * dist;
        // Apply lateral velocity (perpendicular to heading)
        const latRad = rad + Math.PI / 2;
        carX += Math.sin(latRad) * lateralVelocity * dt;
        carZ += Math.cos(latRad) * lateralVelocity * dt;
      }

      if (vehicleMode === 'fly') {
        // Plane: Cessna-like physics — constant forward momentum
        // (1) Maintain minimum airspeed of 30 (auto-throttle if below)
        if (carSpeed < 30) carSpeed += ACCEL * dt * 0.5; // auto-throttle to prevent stall
        if (carSpeed > MAX_SPEED * 1.5) carSpeed = MAX_SPEED * 1.5; // planes can go faster

        // (8) Smooth takeoff: interpolate altitude from terrain+5 to 50 over 2 seconds
        if (planeTakeoffT < 1) {
          planeTakeoffT = Math.min(1, planeTakeoffT + dt / 2); // 2-second ramp
          planeAlt = planeTakeoffStart + (planeTakeoffTarget - planeTakeoffStart) * planeTakeoffT;
        } else {
          // Altitude: up key = climb, down key = descend, auto-level when neutral
          if (keys.up) planeAlt += 15 * dt;
          else if (keys.down) planeAlt -= 15 * dt;
          else planeAlt += (50 - planeAlt) * dt * 0.5; // auto-level to 50m
        }

        planeAlt = Math.max(getTerrainHeight(carX, carZ) + 5, Math.min(300, planeAlt));

        carGroup.position.set(carX, planeAlt, carZ);
        carGroup.rotation.y = carHeading * Math.PI / 180;
        // (5) Pitch: nose-up when climbing, nose-down when descending
        carGroup.rotation.x = keys.up ? -0.2 : keys.down ? 0.15 : 0;
        // (4) Bank: roll into turns based on turn input
        const turnInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0) - steerValue;
        const bankAngle = turnInput * 0.12;
        carGroup.rotation.z = bankAngle;

        // (6) Spin propeller fast
        const prop = carGroup.children.find(c => c.userData && c.userData.isProp);
        if (prop) prop.rotation.x += dt * 50;

        // (7) Update shadow plane — flat dark circle at terrain height
        if (planeShadow) {
          const groundH = getTerrainHeight(carX, carZ);
          planeShadow.position.set(carX, groundH + 0.5, carZ);
          // Scale shadow based on altitude (smaller when higher)
          const altRatio = Math.min(1, (planeAlt - groundH) / 100);
          const shadowScale = 1.5 - altRatio * 0.8;
          planeShadow.scale.set(shadowScale, shadowScale, 1);
          planeShadow.material.opacity = 0.35 * (1 - altRatio * 0.5);
        }
      } else if (vehicleMode === 'boat') {
        // Boat mode: stay on water surface, can't go on land
        const terrainHeight = getTerrainHeight(carX, carZ);
        if (terrainHeight > tideLevel) {
          // Push boat back — can't go on land
          carSpeed *= 0.3;
          carX -= Math.sin(carHeading * Math.PI / 180) * 3;
          carZ -= Math.cos(carHeading * Math.PI / 180) * 3;
        }
        // Wave bobbing
        const bobY = Math.sin(now * 0.003) * 0.3;
        carGroup.position.set(carX, tideLevel + 1 + bobY, carZ);
        carGroup.rotation.y = carHeading * Math.PI / 180;
        // Wave-induced pitch and roll
        carGroup.rotation.x = Math.sin(now * 0.002) * 0.05;
        carGroup.rotation.z = Math.sin(now * 0.0025 + 1) * 0.05;
        
        // Update wake trail line — follows boat path
        if (wakeTrailLine && Math.abs(carSpeed) > 1) {
          wakeTrailPoints.push(new THREE.Vector3(carX, tideLevel + 0.2, carZ));
          if (wakeTrailPoints.length > WAKE_TRAIL_MAX) wakeTrailPoints.shift();
          wakeTrailLine.geometry.setFromPoints(wakeTrailPoints);
          wakeTrailLine.material.opacity = 0.8;
        }
        
        // Water ripple/wake — spawn ripple particles behind boat
        if (Math.abs(carSpeed) > 2 && now % 200 < 20) {
          const wakeGeo = new THREE.RingGeometry(0.5, 1.5, 12);
          const wakeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
          const wake = new THREE.Mesh(wakeGeo, wakeMat);
          wake.rotation.x = -Math.PI / 2;
          const wakeRad = carHeading * Math.PI / 180;
          wake.position.set(carX - Math.sin(wakeRad) * 4, tideLevel + 0.1, carZ - Math.cos(wakeRad) * 4);
          wake.userData = { spawnTime: now, life: 2000 };
          scene.add(wake);
          // Animate wake ripples — expand and fade
          setTimeout(() => {
            if (wake.parent) scene.remove(wake);
          }, 2000);
        }
        // Animate existing wakes
        scene.children.forEach(child => {
          if (child.userData && child.userData.spawnTime) {
            const age = (now - child.userData.spawnTime) / child.userData.life;
            if (age < 1) {
              child.scale.set(1 + age * 3, 1 + age * 3, 1);
              child.material.opacity = 0.6 * (1 - age);
            }
          }
        });
      } else {
        // Drive mode
        if (islandMask(carX, carZ) <= 0.05) {
          carSpeed *= 0.5;
          carX -= Math.sin(carHeading * Math.PI / 180) * 2;
          carZ -= Math.cos(carHeading * Math.PI / 180) * 2;
        }
        const terrainHeight = getTerrainHeight(carX, carZ);
        // (6) Suspension bounce — small sin offset on car Y
        const suspensionBounce = Math.sin(now * 0.01) * 0.1;
        carGroup.position.set(carX, Math.max(terrainHeight + 0.5 + suspensionBounce, 0), carZ);
        carGroup.rotation.y = carHeading * Math.PI / 180;
        carGroup.rotation.x = 0;
        const tilt = (keys.left ? 0.05 : keys.right ? -0.05 : 0) - steerValue * 0.05;
        carGroup.rotation.z = tilt * (Math.abs(carSpeed) / MAX_SPEED);
      }

      // AI cars
      aiCars.forEach(ai => {
        if (Math.random() < 0.01) ai.targetHeading = Math.random() * 360;
        let diff = ai.targetHeading - ai.heading;
        if (diff > 180) diff -= 360; if (diff < -180) diff += 360;
        ai.heading += diff * 0.02;
        const dist = ai.speed * 0.3 * dt;
        const rad = ai.heading * Math.PI / 180;
        ai.x += Math.sin(rad) * dist; ai.z += Math.cos(rad) * dist;
        if (islandMask(ai.x, ai.z) <= 0.05) {
          ai.targetHeading = ai.heading + 180 + (Math.random() - 0.5) * 60;
          ai.x -= Math.sin(rad) * 3; ai.z -= Math.cos(rad) * 3;
        }
        const ah = getTerrainHeight(ai.x, ai.z);
        ai.mesh.position.set(ai.x, Math.max(ah + 0.5, 0), ai.z);
        ai.mesh.rotation.y = ai.heading * Math.PI / 180;
      });

      // Birds
      birds.forEach(bird => {
        const ud = bird.userData;
        ud.angle += ud.speed;
        bird.position.x = Math.cos(ud.angle) * ud.radius;
        bird.position.z = -50 + Math.sin(ud.angle) * ud.radius;
        bird.position.y = ud.height + Math.sin(now * 0.003 + ud.wingPhase) * 3;
        bird.rotation.y = -ud.angle + Math.PI/2;
        bird.scale.y = 1 + Math.sin(now * 0.02 + ud.wingPhase) * 0.3;
      });

      // Buoys — bob with tide
      buoys.forEach(buoy => {
        buoy.position.y = tideLevel + Math.sin(now * 0.003 + buoy.userData.baseX * 0.1) * 0.2;
      });

      // Clouds — drift in +x, wrap around
      clouds.forEach(cloud => {
        cloud.position.x += cloud.userData.speed * dt;
        if (cloud.position.x > 350) cloud.position.x = -350;
      });

      // ====== REWARDS CHECKING ======
      // Track distance traveled
      if (Math.abs(carSpeed) > 0.1) {
        totalDistance += Math.abs(carSpeed) * 0.3 * dt;
      }

      // Landmark proximity (+50 each, once per session)
      landmarks.forEach(lm => {
        if (lm.awarded) return;
        const dx = lm.x - carX, dz = lm.z - carZ;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < 20) {
          lm.awarded = true;
          addPoints(50, `🏛️ ${lm.name} discovered! +50 pts`);
        }
      });

      // AI car proximity (+10 within 15 units)
      aiCars.forEach(ai => {
        const dx = ai.x - carX, dz = ai.z - carZ;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < 15) {
          if (!ai.proximityAwarded || now - ai.proximityAwarded > 5000) {
            ai.proximityAwarded = now;
            addPoints(10, `🚗 Near ${ai.name}! +10 pts`);
          }
        }
      });

      // Speed bonus (+20 for maintaining speed>60 for 5 seconds)
      if (Math.abs(carSpeed) > 60) {
        speedTimer += dt;
        if (speedTimer >= 5 && !speedBonusAwarded) {
          speedBonusAwarded = true;
          addPoints(20, `⚡ Speed demon! 5s above 60 km/h +20 pts`);
        }
      } else {
        speedTimer = 0;
        speedBonusAwarded = false;
      }

      updateScoreDisplay();

      // Camera
      const camRad = carHeading * Math.PI / 180;
      let camDist, camHeight, camTargetY;
      if (vehicleMode === 'boat') {
        // Boat: closer and lower chase cam for better visibility
        if (camMode === 'chase') { camDist = 8 + Math.abs(carSpeed) * 0.05; camHeight = 4; }
        else if (camMode === 'far') { camDist = 25; camHeight = 15; }
        else if (camMode === 'top') { camDist = 0.1; camHeight = 60; }
        else if (camMode === 'cockpit') { camDist = -1; camHeight = 2; }
        else { camDist = 8; camHeight = 4; }
      } else if (camMode === 'chase') { camDist = 12 + Math.abs(carSpeed) * 0.1; camHeight = 6 + Math.abs(carSpeed) * 0.05; }
      else if (camMode === 'far') { camDist = 30; camHeight = 20; }
      else if (camMode === 'top') { camDist = 0.1; camHeight = 80; }
      else if (camMode === 'cockpit') { camDist = -1; camHeight = 2; }
      else { camDist = 12; camHeight = 6; }

      const targetX = carX - Math.sin(camRad) * camDist;
      const targetZ = carZ - Math.cos(camRad) * camDist;
      const targetY = carGroup.position.y + camHeight;

      if (camMode === 'top') {
        camera.position.x += (carX - camera.position.x) * 0.1;
        camera.position.y += (targetY - camera.position.y) * 0.1;
        camera.position.z += (carZ - camera.position.z) * 0.1;
        camera.lookAt(carX, getTerrainHeight(carX, carZ), carZ);
      } else if (camMode === 'cockpit') {
        camera.position.x = carGroup.position.x + Math.sin(camRad) * 0.5;
        camera.position.y = carGroup.position.y + 1.5;
        camera.position.z = carGroup.position.z + Math.cos(camRad) * 0.5;
        camera.lookAt(carGroup.position.x + Math.sin(camRad) * 20, carGroup.position.y + 1, carGroup.position.z + Math.cos(camRad) * 20);
      } else {
        camera.position.x += (targetX - camera.position.x) * 0.1;
        camera.position.y += (targetY - camera.position.y) * 0.1;
        camera.position.z += (targetZ - camera.position.z) * 0.1;
        camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);
      }

      // HUD
      document.getElementById('speed').textContent = `Speed: ${Math.round(Math.abs(carSpeed))} km/h`;
      if (vehicleMode === 'fly') {
        document.getElementById('loc').textContent = `Alt: ${Math.round(planeAlt)}m · Jersey CI`;
      } else if (vehicleMode === 'boat') {
        document.getElementById('loc').textContent = `Tide: ${tideLevel.toFixed(1)}m · Jersey CI`;
      } else {
        document.getElementById('loc').textContent = `Jersey, Channel Islands`;
      }

      // Billboard proximity check
      let nearestBillboard = null;
      let nearestDist = Infinity;
      for (const bb of billboards) {
        const dx = bb.x - carX, dz = bb.z - carZ;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < 30 && d < nearestDist) {
          nearestDist = d;
          nearestBillboard = bb;
        }
      }
      if (nearestBillboard) {
        if (!adScored.has(nearestBillboard.name)) {
          adScored.add(nearestBillboard.name);
          if (typeof score !== 'undefined') { score += 5; updateScoreDisplay(); }
        }
        showAdPopup(nearestBillboard.name, nearestBillboard.tagline);
      } else if (adPopupTimer > 0) {
        adPopupTimer -= dt;
        if (adPopupTimer <= 0) adPopup.classList.remove('show');
      }

      drawRadar();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // ====== WEATHER ======
    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=49.21&longitude=-2.13&current=temperature_2m,wind_speed_10m,weather_code,is_day&timezone=Europe/Jersey');
        const data = await res.json();
        const cur = data.current;
        const temp = Math.round(cur.temperature_2m), wind = Math.round(cur.wind_speed_10m), code = cur.weather_code, isDay = cur.is_day;
        const icons = { 0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',80:'🌧️',81:'🌧️',95:'⛈️' };
        const descs = { 0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Foggy',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Slight rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',95:'Thunderstorm' };
        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('weather-icon').textContent = icons[code] || '🌤️';
        document.getElementById('weather-desc').textContent = `${descs[code] || 'Clear'} · ${wind}km/h`;
        if (!isDay) {
          // Night mode handled by applySkyAndSun — but sync if weather says night
          applySkyAndSun();
        }
      } catch (e) { console.error('Weather fetch failed:', e); }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    fetchWeather();
    document.getElementById('loading').style.display = 'none';
    requestAnimationFrame(animate);
    setInterval(fetchWeather, 600000);
  </script>
</body>
</html>
